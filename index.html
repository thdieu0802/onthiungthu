cine HPV đạt hiệu quả bảo vệ ung thư cổ tử cung cao nhất (giảm xuống còn 0.1/100.000 PN) nếu được tiêm trước độ tuổi nào?", "a": ["A. Trước 12 tuổi", "B. Trước 17 tuổi", "C. Trước 25 tuổi", "D. Trước 30 tuổi"], "c": 1, "e": "Các nghiên cứu chỉ ra tiêm HPV trước 17 tuổi (trước khi phơi nhiễm tình dục) làm giảm tỷ lệ mắc ung thư xuống mức cực thấp."}, {"q": "Câu 9: Phương pháp sàng lọc nào được xem là tiêu chuẩn vàng để phát hiện sớm ung thư đại trực tràng?", "a": ["A. Nội soi đại trực tràng (Colonoscopy)", "B. Siêu âm ổ bụng", "C. Chụp X-quang bụng đứng", "D. Xét nghiệm máu CEA"], "c": 0, "e": "Nội soi đại trực tràng cho phép quan sát trực tiếp bề mặt niêm mạc, đồng thời có thể cắt bỏ polyp tiền ung thư."}, {"q": "Câu 10: Đối tượng nào có nguy cơ rất cao mắc ung thư vú và ung thư buồng trứng theo yếu tố di truyền?", "a": ["A. Người mang đột biến gen p53", "B. Người mang đột biến gen BRCA1 / BRCA2", "C. Người có gen EGFR đột biến", "D. Người nhiễm virus HPV"], "c": 1, "e": "Gen BRCA1/2 là gen sửa chữa DNA, khi bị đột biến sẽ làm tăng đột biến tích lũy và dẫn đến ung thư vú/buồng trứng."}, {"q": "Câu 11: Trong ung thư tuyến tiền liệt, xét nghiệm máu nào thường được sử dụng kết hợp với khám trực tràng bằng tay (DRE) để tầm soát?", "a": ["A. AFP", "B. CEA", "C. PSA", "D. CA 125"], "c": 2, "e": "PSA (Prostate-Specific Antigen) là kháng nguyên đặc hiệu tuyến tiền liệt, dùng phổ biến trong tầm soát ung thư cơ quan này."}, {"q": "Câu 12: Khuyến cáo của Health Canada (2023) về giới hạn việc uống rượu an toàn để giảm nguy cơ ung thư và bệnh lý khác là bao nhiêu?", "a": ["A. Không quá 2 ly tiêu chuẩn mỗi ngày", "B. Không quá 2 ly tiêu chuẩn mỗi tuần", "C. Không quá 7 ly tiêu chuẩn mỗi tuần", "D. Uống rượu vang đỏ mỗi ngày đều tốt"], "c": 1, "e": "Hướng dẫn mới nhất hạ thấp giới hạn an toàn xuống tối đa 2 ly/tuần để tránh các rủi ro sức khỏe, bao gồm ung thư."}, {"q": "Câu 13: Phương pháp sàng lọc thứ phát đối với ung thư cổ tử cung bao gồm các phương pháp nào?", "a": ["A. Siêu âm ngả âm đạo, CT scan", "B. VIA, Pap smear (tế bào học), Xét nghiệm HPV", "C. Sinh thiết nón cổ tử cung, MRI vùng chậu", "D. Xét nghiệm máu CA 125"], "c": 1, "e": "Bộ ba VIA, xét nghiệm tế bào học Pap smear và xét nghiệm HPV DNA là các kỹ thuật sàng lọc chuẩn cho ung thư CTC."}, {"q": "Câu 14: Sàng lọc ung thư phổi được khuyến cáo thực hiện bằng phương pháp nào cho đối tượng nguy cơ cao?", "a": ["A. Chụp X-quang phổi thẳng hàng năm", "B. Chụp PET/CT toàn thân", "C. Chụp cắt lớp vi tính liều thấp (Low-dose CT - LDCT)", "D. Nội soi phế quản định kỳ"], "c": 2, "e": "LDCT giúp phát hiện các nốt nhỏ ở phổi sớm hơn X-quang với mức phơi nhiễm tia xạ thấp, giúp giảm tỷ lệ tử vong."}, {"q": "Câu 15: Dự phòng cấp III (Tertiary Prevention) tập trung vào vấn đề gì?", "a": ["A. Tiêm vaccine phòng bệnh", "B. Khám tầm soát cộng đồng", "C. Điều trị bệnh đã được chẩn đoán để giảm thiểu biến chứng và tử vong", "D. Thay đổi thói quen ăn uống ở người khỏe mạnh"], "c": 2, "e": "Cấp III áp dụng khi bệnh đã xảy ra, tập trung vào điều trị triệt căn hoặc giảm nhẹ để kéo dài và nâng cao chất lượng sống."}, {"q": "Câu 16: Theo hướng dẫn của NCCN, phụ nữ có nguy cơ trung bình nên bắt đầu chụp nhũ ảnh (Mammogram) tầm soát ung thư vú thường niên từ độ tuổi nào?", "a": ["A. 25 tuổi", "B. 30 tuổi", "C. Từ 40 tuổi", "D. 55 tuổi"], "c": 2, "e": "NCCN khuyến cáo phụ nữ không có yếu tố nguy cơ cao nên bắt đầu chụp nhũ ảnh định kỳ hàng năm từ 40 tuổi."}, {"q": "Câu 17: Các thuốc hóa dự phòng (Chemoprevention) như Aspirin được các hướng dẫn cân nhắc sử dụng để giảm nguy cơ ung thư nào trong hội chứng Lynch?", "a": ["A. Ung thư vú", "B. Ung thư đại trực tràng", "C. Ung thư phổi", "D. Ung thư tuyến giáp"], "c": 1, "e": "Các nghiên cứu cho thấy dùng Aspirin liều thấp làm giảm đáng kể sự hình thành polyp và ung thư đại trực tràng ở hội chứng Lynch."}, {"q": "Câu 18: Hội chứng Lynch (Lynch Syndrome) do đột biến các gen sửa chữa DNA ghép cặp sai. Gen nào sau đây bị đột biến chiếm tỷ lệ cao nhất (khoảng 50%)?", "a": ["A. MLH1", "B. MSH2", "C. MSH6", "D. PMS2"], "c": 1, "e": "MSH2 và MLH1 là hai gen phổ biến nhất gây hội chứng Lynch, trong đó MSH2 chiếm tỷ trọng cao nhất khoảng 50%."}, {"q": "Câu 19: Ở những người mang đột biến gen BRCA1, nguy cơ tích lũy mắc ung thư vú (đến năm 70 tuổi) là khoảng bao nhiêu phần trăm?", "a": ["A. 10% - 20%", "B. 25% - 35%", "C. 60% - 72%", "D. Gần 100%"], "c": 2, "e": "Người mang đột biến BRCA1 có rủi ro mắc ung thư vú tích lũy rất cao, lên đến 60-72% trong suốt cuộc đời."}, {"q": "Câu 20: Phương pháp xét nghiệm FIT định lượng (đo lượng máu vi thể trong phân) trong sàng lọc ung thư đại trực tràng được khuyến cáo thực hiện với tần suất như thế nào?", "a": ["A. Mỗi 6 tháng", "B. Mỗi năm 1 lần (Annually)", "C. Mỗi 3 năm 1 lần", "D. Mỗi 10 năm 1 lần"], "c": 1, "e": "FIT có độ nhạy phát hiện máu ẩn khá tốt, nhưng để không bỏ sót tổn thương cần thực hiện đều đặn mỗi năm một lần."}, {"q": "Câu 21: Tiêu chuẩn chỉ định sàng lọc ung thư phổi bằng LDCT theo NCCN ưu tiên cho nhóm đối tượng nào?", "a": ["A. Bất kỳ ai trên 50 tuổi", "B. Người $\\ge50$ tuổi VÀ có tiền sử hút thuốc $\\ge20$ pack-year (gói-năm)", "C. Người $\\ge40$ tuổi có ho kéo dài", "D. Bệnh nhân đã từng mắc ung thư tuyến giáp"], "c": 1, "e": "Chỉ định LDCT dành riêng cho nhóm nguy cơ cao: người từ 50 tuổi trở lên và có tiền sử hút thuốc lá nặng (trên 20 gói-năm)."}, {"q": "Câu 22: Ở phụ nữ mang đột biến gen BRCA1, phẫu thuật dự phòng cắt vòi trứng-buồng trứng hai bên (RRSO) được khuyến cáo thực hiện ở độ tuổi nào?", "a": ["A. 20 - 25 tuổi", "B. 35 - 40 tuổi", "C. 45 - 50 tuổi", "D. Sau 55 tuổi (sau mãn kinh)"], "c": 1, "e": "Ung thư buồng trứng ở người mang BRCA1 thường khởi phát sớm, do đó NCCN khuyến cáo cắt buồng trứng phòng ngừa ở tuổi 35-40."}, {"q": "Câu 23: Sự kết hợp giữa nguy cơ di truyền cao và lối sống không lành mạnh làm tăng nguy cơ tử vong do mọi nguyên nhân lên khoảng bao nhiêu lần theo The Lancet (2023)?", "a": ["A. Khoảng 1.13 lần", "B. Khoảng 1.80 lần (HR 1.80)", "C. Khoảng 5.0 lần", "D. Hơn 10 lần"], "c": 1, "e": "Nghiên cứu dịch tễ lớn trên The Lancet cho thấy chỉ số rủi ro (Hazard Ratio - HR) là 1.80 đối với nhóm mang cả hai yếu tố này."}, {"q": "Câu 24: Một trong những nhược điểm (nguy cơ) tiềm ẩn của việc tầm soát ung thư phổi bằng LDCT là gì?", "a": ["A. Gây suy thận cấp", "B. Tỷ lệ dương tính giả dẫn đến lo âu và làm thêm các can thiệp không cần thiết", "C. Chắc chắn gây ung thư thứ phát do tia xạ liều cao", "D. Không phát hiện được khối u trên 5cm"], "c": 1, "e": "Rất nhiều nốt mờ phổi phát hiện qua CT là lành tính (sẹo cũ, viêm), gây tâm lý hoang mang và dẫn đến sinh thiết oan uổng."}, {"q": "Câu 25: Thuốc tránh thai đường uống (OCP) kết hợp Estrogen/Progestin mang lại lợi ích giảm nguy cơ mắc loại ung thư nào ở phụ nữ mang đột biến gen BRCA?", "a": ["A. Ung thư vú", "B. Ung thư buồng trứng", "C. Ung thư cổ tử cung", "D. Ung thư đại trực tràng"], "c": 1, "e": "OCP ức chế quá trình rụng trứng liên tục, làm giảm số lần tổn thương biểu mô bề mặt buồng trứng, từ đó giảm nguy cơ ung thư."}, {"q": "Câu 26: Những người có tiền sử từng xạ trị vào vùng ngực trong độ tuổi từ 10-30 tuổi cần được sàng lọc ung thư vú bắt đầu từ khi nào?", "a": ["A. 2 năm sau khi xạ trị", "B. 8 năm sau khi kết thúc xạ trị (nhưng không trước 25 tuổi)", "C. Bắt buộc từ 40 tuổi", "D. Không cần sàng lọc vì tia xạ đã tiêu diệt tế bào u"], "c": 1, "e": "Khuyến cáo NCCN yêu cầu tầm soát sớm cho nhóm này vì tia xạ làm tăng nguy cơ ung thư vú thứ phát sau khoảng thời gian ủ bệnh."}, {"q": "Câu 27: Việc giảm béo phì thông qua phẫu thuật thu nhỏ dạ dày (Bariatric surgery) tác động như thế nào đến tỷ lệ tử vong?", "a": ["A. Tăng tỷ lệ tử vong do suy dinh dưỡng", "B. Giảm đáng kể tỷ lệ tử vong chung theo thời gian theo dõi so với nhóm không phẫu thuật", "C. Không làm thay đổi tỷ lệ tử vong, chỉ thay đổi ngoại hình", "D. Làm tăng nguy cơ mắc ung thư thực quản"], "c": 1, "e": "Giảm cân tích cực sau mổ giúp kiểm soát tốt các bệnh chuyển hóa, tim mạch và giảm nguy cơ ung thư, từ đó giảm tỷ lệ tử vong."}, {"q": "Câu 28: Trong hệ thống đánh giá chức năng gan Child-Pugh, thông số nào sau đây KHÔNG được sử dụng?", "a": ["A. Bilirubin máu", "B. Albumin máu", "C. Mức độ báng bụng (Ascites)", "D. Nồng độ AFP"], "c": 3, "e": "Thang điểm Child-Pugh chỉ dùng 5 tiêu chí: Albumin, Bilirubin, Tỷ lệ Prothrombin (INR), Báng bụng và Bệnh não gan; không dùng AFP."}, {"q": "Câu 29: Chiến lược SAFER của WHO nhằm kiểm soát yếu tố nguy cơ nào?", "a": ["A. Thuốc lá", "B. Ánh nắng mặt trời", "C. Rượu bia (Alcohol)", "D. Béo phì"], "c": 2, "e": "SAFER là nhóm 5 chiến lược cốt lõi của WHO để giảm thiểu các tác hại liên quan đến việc tiêu thụ đồ uống có cồn."}, {"q": "Câu 30: Isoflavone trong đậu nành có cấu trúc hóa học tương tự với hormone nào của con người, từ đó có thể có tác động lên một số loại ung thư?", "a": ["A. Testosterone", "B. Insulin", "C. Estrogen (Estradiol)", "D. Progesterone"], "c": 2, "e": "Isoflavone là một phytoestrogen (estrogen thực vật), có cấu trúc vòng tương tự estradiol nên có thể gắn vào thụ thể estrogen."}, {"q": "Câu 31: Phân tích độ nhạy và độ đặc hiệu của phương pháp sàng lọc ung thư đại trực tràng: Chụp cắt lớp vi tính đại tràng (CT colonography) có độ nhạy phát hiện adenoma $\\ge10mm$ là bao nhiêu?", "a": ["A. Khoảng 50%", "B. Khoảng 74-75%", "C. Khoảng 89%", "D. Gần như 100%"], "c": 2, "e": "Theo hướng dẫn NCCN, CT nội soi đại tràng ảo có độ nhạy rất tốt (khoảng 89%) đối với các khối polyp kích thước lớn từ 1cm trở lên."}, {"q": "Câu 32: Ở nam giới mang đột biến gen BRCA2, ngoài ung thư vú nam, họ còn có nguy cơ gia tăng đáng kể mắc bệnh lý ác tính nào so với cộng đồng?", "a": ["A. Ung thư tinh hoàn", "B. Ung thư tuyến tiền liệt (Absolute risk: 19%-61%)", "C. Ung thư gan", "D. Ung thư bàng quang"], "c": 1, "e": "Nam giới mang BRCA2 có nguy cơ tích lũy mắc ung thư tiền liệt tuyến rất cao và thường là thể ác tính tiến triển nhanh."}, {"q": "Câu 33: Theo NCCN, với bệnh nhân ung thư tuyến tiền liệt có nguy cơ cao (như gốc gác Châu Phi, có đột biến gen) thì nên bắt đầu thảo luận và xét nghiệm PSA nền ở độ tuổi nào?", "a": ["A. 30 tuổi", "B. 40 tuổi", "C. 50 tuổi", "D. 60 tuổi"], "c": 1, "e": "Do tính chất nguy cơ cao, NCCN khuyến cáo nên hạ độ tuổi bắt đầu thảo luận và lấy mốc PSA nền xuống 40 tuổi."}, {"q": "Câu 34: Sự khác biệt về thời gian tiến hành phẫu thuật dự phòng RRSO ở người mang đột biến BRCA2 so với BRCA1 là gì?", "a": ["A. BRCA2 phải cắt sớm hơn 10 năm so với BRCA1", "B. BRCA2 có thể trì hoãn muộn hơn (tuổi 40-45) so với BRCA1 (tuổi 35-40) vì thời điểm khởi phát bệnh trung bình muộn hơn", "C. Cả hai phải cắt buồng trứng ngay ở tuổi 25", "D. Người mang BRCA2 không cần cắt buồng trứng"], "c": 1, "e": "Ung thư buồng trứng ở người mang BRCA2 thường khởi phát trễ hơn khoảng 8-10 năm, cho phép bệnh nhân có thêm thời gian để sinh con."}, {"q": "Câu 35: Tại sao những bệnh nhân mắc hội chứng Lynch lại được khuyến cáo nội soi đại tràng mỗi 1-2 năm thay vì 10 năm như dân số chung?", "a": ["A. Vì quá trình từ adenoma tiến triển thành ung thư ở nhóm này diễn ra rất nhanh", "B. Vì niêm mạc đại tràng của họ không bắt thuốc nhuộm", "C. Vì thuốc xổ đại tràng không có tác dụng với họ", "D. Vì họ thường bị viêm loét đại tràng chảy máu liên tục"], "c": 0, "e": "Rối loạn sửa chữa DNA (mismatch repair) khiến tốc độ chuyển dạng từ polyp lành thành ung thư ở hội chứng Lynch diễn ra chỉ trong 1-3 năm."}, {"q": "Câu 36: Trong sàng lọc ung thư phổi bằng LDCT, \"Shared patient/provider decision-making\" mang ý nghĩa bắt buộc đối với việc gì?", "a": ["A. Chia sẻ chi phí chụp CT", "B. Bác sĩ phải bắt buộc bệnh nhân bỏ thuốc lá mới cho chụp", "C. Thảo luận kỹ về các lợi ích (giảm tử vong) và rủi ro (dương tính giả, bức xạ) trước khi tiến hành", "D. Bệnh nhân tự đọc kết quả phim CT của mình"], "c": 2, "e": "Sàng lọc LDCT có nhiều rủi ro đi kèm, do đó bệnh nhân cần được bác sĩ tư vấn đầy đủ để tự đưa ra quyết định tham gia."}, {"q": "Câu 37: Cơ chế sinh học nào liên kết tình trạng béo phì với ung thư tế bào gan (HCC)?", "a": ["A. Mỡ chèn ép trực tiếp làm rách màng tế bào gan", "B. Thông qua bệnh gan nhiễm mỡ không do rượu (NAFLD) tiến triển thành viêm gan thoái hóa mỡ (NASH), gây xơ hóa và ung thư", "C. Vi khuẩn HP sinh sôi trong mô mỡ rồi di chuyển lên gan", "D. Mô mỡ hấp thụ hết lượng thuốc kháng virus HBV"], "c": 1, "e": "Sự tích tụ mỡ ở gan gây viêm mạn tính và xơ hóa (NASH), làm nền tảng cho các đột biến sinh ung thư biểu mô tế bào gan."}, {"q": "Câu 38: Đối với bệnh nhân được chẩn đoán ung thư tuyến vú có thụ thể nội tiết dương tính, loại thuốc hóa dự phòng nào có khả năng giảm nguy cơ ung thư vú đối bên?", "a": ["A. Kháng thể đơn dòng Trastuzumab", "B. Tamoxifen hoặc Aromatase inhibitors (chất ức chế aromatase)", "C. Thuốc giảm đau Aspirin", "D. Hóa trị phác đồ TAC"], "c": 1, "e": "Liệu pháp nội tiết chặn sự phát triển của tế bào ác tính nhạy cảm hormone, ngăn ngừa tái phát và làm giảm nguy cơ phát sinh u mới ở vú còn lại."}, {"q": "Câu 39: Đánh giá nào sau đây phản ánh chính xác nhất mối liên hệ giữa thời gian sống thêm và tỷ lệ mắc bệnh toàn bộ (Prevalence) trong dịch tễ học ung thư?", "a": ["A. Thời gian sống thêm càng dài thì tỷ lệ mắc bệnh toàn bộ càng giảm", "B. Thời gian sống thêm dài thì tỷ lệ mắc bệnh toàn bộ sẽ tăng lên cho dù tỷ lệ mắc mới (Incidence) không tăng", "C. Thời gian sống thêm không liên quan đến tỷ lệ mắc bệnh toàn bộ", "D. Khi tỷ lệ tử vong bằng 0 thì tỷ lệ mắc bệnh toàn bộ cũng bằng 0"], "c": 1, "e": "Prevalence là tổng số người sống chung với bệnh. Nếu bệnh nhân không chết mà sống kéo dài, số lượng người mang bệnh trong cộng đồng sẽ tích lũy và tăng lên."}, {"q": "Câu 40: Trong kế hoạch hành động quốc gia (QĐ 358/QĐ-BYT), định hướng tài chính ưu tiên nhằm đảm bảo tính bền vững cho sàng lọc ung thư cổ tử cung và vú là gì?", "a": ["A. Kêu gọi quyên góp từ thiện cho 100% bệnh nhân", "B. Tích hợp chi phí sàng lọc vào gói quyền lợi của chương trình Bảo hiểm Y tế (BHYT)", "C. Tăng giá xét nghiệm để bù đắp chi phí", "D. Yêu cầu các bệnh viện tư nhân miễn phí hoàn toàn xét nghiệm"], "c": 1, "e": "Chi trả qua Bảo hiểm Y tế là phương thức tài chính công bền vững nhất để duy trì một chương trình sàng lọc diện rộng cho toàn dân."}, {"q": "Câu 41: Thuật ngữ \"Oncology\" (Ung thư học) bắt nguồn từ tiếng Hy Lạp \"Oncos\" mang ý nghĩa là gì?", "a": ["A. Con cua", "B. Khối u (Tumor/Mass)", "C. Nỗi đau", "D. Tế bào chết"], "c": 1, "e": "Trong tiếng Hy Lạp cổ, \"Oncos\" có nghĩa là gánh nặng, sưng tấy hoặc khối u, từ đó hình thành ngành Oncology."}, {"q": "Câu 42: Biểu tượng truyền thống của bệnh ung thư trong y học là con vật nào?", "a": ["A. Con rắn", "B. Con rùa", "C. Con cua (Crab/Karkinos)", "D. Con nhện"], "c": 2, "e": "Hippocrates gọi các khối u ác tính là \"Karkinos\" (con cua) vì các tĩnh mạch giãn bao quanh khối u trông giống chân cua."}, {"q": "Câu 43: Đặc điểm nào sau đây mô tả đúng nhất về bướu ác tính (Ung thư)?", "a": ["A. Thường lớn chậm, khu trú tại chỗ", "B. Khỏi hẳn sau khi phẫu thuật cắt bỏ, không tái phát", "C. Phát triển không kiểm soát, xâm lấn mô xung quanh và di căn xa", "D. Chỉ phát triển đến một kích thước nhất định rồi dừng lại"], "c": 2, "e": "Sự xâm lấn tổ chức lân cận và khả năng di chuyển (di căn) đến cơ quan khác là đặc trưng sống còn phân biệt u ác tính với u lành tính."}, {"q": "Câu 44: Tỷ lệ mắc mới (Incidence) trong dịch tễ học ung thư được định nghĩa là gì?", "a": ["A. Tổng số người mắc bệnh ung thư đang sống trong cộng đồng", "B. Số ca tử vong do ung thư trong một năm", "C. Số ca mới mắc bệnh trong quần thể trên 100.000 dân trong một năm", "D. Số người sống sót qua 5 năm sau khi chẩn đoán"], "c": 2, "e": "Incidence Rate luôn được tính bằng số ca chẩn đoán mới chia cho 100.000 dân trong khoảng thời gian một năm."}, {"q": "Câu 45: Theo Globocan 2022, ở Việt Nam, loại ung thư nào có số ca mắc mới đứng hàng đầu tính chung cho cả hai giới?", "a": ["A. Ung thư dạ dày", "B. Ung thư phổi", "C. Ung thư vú", "D. Ung thư gan"], "c": 2, "e": "Số liệu Globocan 2022 ghi nhận ung thư vú đạt 24.563 ca, vượt qua ung thư gan (24.502 ca) để đứng vị trí số 1 tại VN."}, {"q": "Câu 46: Ở nam giới Việt Nam (Globocan 2022), hai loại ung thư nào chiếm tỷ lệ mắc mới cao nhất?", "a": ["A. Ung thư đại trực tràng và ung thư dạ dày", "B. Ung thư gan và ung thư phổi", "C. Ung thư tuyến tiền liệt và ung thư bàng quang", "D. Ung thư vòm họng và ung thư máu"], "c": 1, "e": "Ung thư gan và phổi liên quan trực tiếp tới rượu, viêm gan virus và thuốc lá, là hai nguyên nhân hàng đầu ở nam giới VN."}, {"q": "Câu 47: Tỷ lệ tử vong (Mortality) do ung thư phản ánh điều gì?", "a": ["A. Số ca tử vong do ung thư trên 100.000 dân trong một năm", "B. Số bệnh nhân tử vong ngay trên bàn mổ", "C. Tỷ lệ bệnh nhân tử vong do hóa trị", "D. Tổng số người chết vì mọi nguyên nhân trong bệnh viện ung bướu"], "c": 0, "e": "Tương tự như Incidence, Mortality chuẩn hóa được tính bằng số ca chết vì ung thư trên quy mô 100.000 dân mỗi năm."}, {"q": "Câu 48: Khái niệm \"Thời gian sống thêm toàn bộ\" (Overall Survival - OS) được tính từ thời điểm nào?", "a": ["A. Từ lúc bệnh nhân kết thúc đợt hóa trị cuối cùng", "B. Từ khi bắt đầu điều trị (hoặc chẩn đoán) đến khi bệnh nhân tử vong do bất kỳ nguyên nhân nào", "C. Từ lúc bệnh tái phát đến khi tử vong", "D. Từ lúc sinh ra đến khi mắc ung thư"], "c": 1, "e": "OS là tiêu chí sống còn vàng, bao gồm tử vong do bệnh hay do bất kỳ biến cố nào khác kể từ khi bắt đầu chẩn đoán/điều trị."}, {"q": "Câu 49: Ghi nhận ung thư (Cancer Registry) có mục đích chính là gì?", "a": ["A. Cấp phát thuốc miễn phí cho bệnh nhân", "B. Thu thập dữ liệu liên tục về tình hình mắc ung thư để đánh giá và kiểm soát gánh nặng bệnh tật", "C. Xếp hạng tay nghề của các bác sĩ phẫu thuật", "D. Lưu trữ hồ sơ thanh toán bảo hiểm"], "c": 1, "e": "Dữ liệu ghi nhận ung thư là nền tảng để ngành y tế xây dựng kế hoạch dự phòng, sàng lọc và đánh giá hiệu quả điều trị."}, {"q": "Câu 50: \"Thời gian sống không bệnh\" (Disease Free Survival - DFS) mang ý nghĩa gì?", "a": ["A. Khoảng thời gian từ lúc sinh ra đến lúc phát hiện ung thư", "B. Khoảng thời gian bệnh nhân sống mà không cần dùng thuốc giảm đau", "C. Khoảng thời gian sau điều trị triệt căn mà bệnh nhân không có dấu hiệu tái phát bệnh", "D. Khoảng thời gian bệnh nhân có thể tự chăm sóc bản thân"], "c": 2, "e": "DFS đo lường sự thành công của điều trị ban đầu; nếu khối u quay trở lại (tái phát), mốc DFS sẽ dừng lại."}, {"q": "Câu 51: Đặc điểm của một khối bướu lành tính là gì?", "a": ["A. Xâm lấn phá hủy mạnh các cơ quan lân cận", "B. Luôn dẫn đến tử vong trong thời gian ngắn", "C. Có khả năng di căn xa theo đường máu", "D. Lớn chậm, khu trú tại chỗ, ít khi gây tử vong (trừ khi chèn ép cơ quan hiểm yếu)"], "c": 3, "e": "Bướu lành tính thường có vỏ bọc rõ ràng, đẩy lùi chứ không xâm lấn mô lành và tuyệt đối không di căn."}, {"q": "Câu 52: Yếu tố nào sau đây là yếu tố quan trọng nhất xác định nguy cơ mắc ung thư (tỷ lệ mắc mới tăng theo thời gian)?", "a": ["A. Tuổi tác", "B. Nhóm máu", "C. Màu da", "D. Chiều cao"], "c": 0, "e": "Ung thư là bệnh của đột biến gen tích lũy; tuổi càng cao, tế bào càng có nhiều khả năng sai sót trong quá trình phân chia."}, {"q": "Câu 53: Theo Globocan 2022 trên toàn cầu, loại ung thư nào có tỷ lệ tử vong (Mortality) cao nhất ở cả hai giới?", "a": ["A. Ung thư gan", "B. Ung thư phổi", "C. Ung thư dạ dày", "D. Ung thư cổ tử cung"], "c": 1, "e": "Do tính chất khó phát hiện sớm và di căn nhanh, ung thư phổi luôn đứng đầu danh sách gây tử vong trên thế giới."}, {"q": "Câu 54: Loại hình \"Ghi nhận ung thư quần thể\" (Population-based Cancer Registry - PBCR) thu thập dữ liệu từ đâu?", "a": ["A. Chỉ từ một bệnh viện tuyến trung ương duy nhất", "B. Từ tất cả các ca mắc ung thư trong một vùng địa lý dân cư nhất định", "C. Chỉ từ những bệnh nhân có bảo hiểm y tế", "D. Chỉ từ các cơ sở y tế tư nhân"], "c": 1, "e": "PBCR phải thu thập dữ liệu bao phủ toàn bộ dân số một khu vực (hoặc quốc gia) để tính toán chính xác Incidence Rate."}, {"q": "Câu 55: Tỷ lệ mắc bệnh toàn bộ (Prevalence) cho biết thông tin gì?", "a": ["A. Số bệnh nhân tử vong trong tháng", "B. Tỷ lệ bệnh nhân bị rụng tóc do hóa trị", "C. Số ước tính người đang sống chung với bệnh ung thư trong cộng đồng tại một thời điểm", "D. Tốc độ di căn của khối u"], "c": 2, "e": "Prevalence phản ánh gánh nặng thực sự về mặt chăm sóc y tế, bao gồm cả bệnh nhân mới mắc và người đang sống sót cùng bệnh."}, {"q": "Câu 56: \"Thời gian sống bệnh không tiến triển\" (Progression Free Survival - PFS) thường được dùng làm tiêu chí đánh giá trong trường hợp nào?", "a": ["A. Sau khi phẫu thuật cắt bỏ hoàn toàn khối u lành tính", "B. Đánh giá hiệu quả của phương pháp tầm soát sớm", "C. Trong các thử nghiệm lâm sàng, tính từ lúc điều trị đến khi bệnh tiến triển nặng hơn hoặc tử vong", "D. Đánh giá mức độ hài lòng của bệnh nhân về dịch vụ y tế"], "c": 2, "e": "PFS đánh giá xem một loại thuốc/phác đồ có kìm hãm được sự lớn lên của khối u (giữ cho bệnh không xấu đi) hay không."}, {"q": "Câu 57: Theo thống kê Globocan 2022, ung thư cổ tử cung tại Việt Nam nằm ở vị trí nào về số ca mắc mới?", "a": ["A. Nằm trong top 3 ung thư ở nữ giới", "B. Không nằm trong top 5 ung thư tính chung hai giới", "C. Đứng vị trí số 1 ở nữ giới", "D. Đứng vị trí số 2 ở nam giới"], "c": 1, "e": "Top 5 ung thư mắc mới tính chung hai giới ở Việt Nam là Vú, Gan, Phổi, Đại trực tràng, Dạ dày. UT Cổ tử cung đã giảm."}, {"q": "Câu 58: Khái niệm \"Trung vị thời gian sống thêm\" (Median Survival) có ý nghĩa thống kê tốt hơn \"Thời gian sống thêm trung bình\" (Mean Survival) vì lý do gì?", "a": ["A. Vì nó dễ tính nhẩm hơn", "B. Vì nó ít bị sai lệch bởi một vài ca bệnh sống quá dài hoặc chết quá sớm", "C. Vì nó luôn luôn cao hơn thời gian sống trung bình", "D. Vì nó chỉ tính cho những bệnh nhân đã khỏi bệnh"], "c": 1, "e": "Trung vị là điểm cắt mà 50% bệnh nhân đã tử vong và 50% còn sống, giúp phản ánh chính xác nhất xu hướng sống còn của số đông."}, {"q": "Câu 59: Mối quan hệ giữa tỷ lệ mắc mới (Incidence), tỷ lệ mắc bệnh toàn bộ (Prevalence) và thời gian sống thêm được thể hiện như thế nào?", "a": ["A. Prevalence = Incidence + Mortality", "B. Nếu Incidence không đổi, phương pháp điều trị tốt lên làm thời gian sống thêm dài ra thì Prevalence sẽ tăng lên", "C. Khi Prevalence cao thì Incidence chắc chắn phải giảm", "D. Thời gian sống thêm không ảnh hưởng đến Prevalence"], "c": 1, "e": "Bệnh nhân ung thư sống lâu hơn (không chết) sẽ được cộng dồn vào danh sách người bệnh hiện có, làm tăng Prevalence."}, {"q": "Câu 60: Sự khác biệt cơ bản giữa Ghi nhận ung thư quần thể (PBCR) và Ghi nhận ung thư bệnh viện (HBCR) là gì?", "a": ["A. HBCR đắt tiền hơn PBCR", "B. PBCR cung cấp bức tranh thực sự về gánh nặng ung thư của cả cộng đồng, trong khi HBCR chỉ phản ánh đặc điểm bệnh nhân tại một cơ sở y tế cụ thể", "C. PBCR chỉ theo dõi các ung thư giai đoạn cuối", "D. Cả hai là một, không có gì khác biệt"], "c": 1, "e": "HBCR dễ bị sai lệch do phụ thuộc vào uy tín, tuyến bệnh viện chuyên khoa, do đó không thể dùng để tính tỷ lệ dân số."}, {"q": "Câu 61: Biểu đồ đường cong sống còn (Survival curve - Kaplan-Meier) thường thể hiện các thông số nào trên hai trục tọa độ?", "a": ["A. Trục tung là chi phí điều trị, trục hoành là liều lượng thuốc", "B. Trục tung là tỷ lệ bệnh nhân còn sống (%), trục hoành là thời gian theo dõi", "C. Trục tung là kích thước u, trục hoành là cân nặng bệnh nhân", "D. Trục tung là số lượng hồng cầu, trục hoành là thời gian"], "c": 1, "e": "Biểu đồ Kaplan-Meier thể hiện sự sụt giảm dần của nhóm bệnh nhân theo thời gian thông qua các bậc thang đi xuống."}, {"q": "Câu 62: Tỷ lệ tử vong (Mortality) do ung thư ở châu Á chiếm khoảng bao nhiêu phần trăm tổng số tử vong do ung thư trên toàn cầu (Globocan 2022)?", "a": ["A. Khoảng 20.4%", "B. Khoảng 35%", "C. Hơn 56% (56.1%)", "D. Khoảng 90%"], "c": 2, "e": "Châu Á với dân số đông và tỷ lệ phơi nhiễm các tác nhân gây ung thư (viêm gan, thuốc lá) cao đã chiếm tới 56.1% gánh nặng tử vong."}, {"q": "Câu 63: Một số loại ung thư như ung thư tuyến giáp (Thyroid) có Tỷ lệ mắc mới (Incidence) khá cao nhưng Tỷ lệ tử vong (Mortality) lại rất thấp. Điều này cho thấy tính chất gì của bệnh?", "a": ["A. Bệnh phát triển cực kỳ nhanh", "B. Bệnh có tiên lượng rất tốt, thời gian sống thêm dài, ít đe dọa tính mạng", "C. Bệnh không thể điều trị được", "D. Ghi nhận ung thư đã bị sai sót"], "c": 1, "e": "Ung thư tuyến giáp thể nhú phát triển rất chậm và đáp ứng tốt với phẫu thuật, do đó người bệnh có tuổi thọ gần như bình thường."}, {"q": "Câu 64: Ở biểu đồ Globocan 2022 về tử vong do ung thư toàn cầu ở Nữ giới, loại ung thư nào xếp thứ hai sau ung thư vú?", "a": ["A. Ung thư dạ dày", "B. Ung thư phổi", "C. Ung thư cổ tử cung", "D. Ung thư đại trực tràng"], "c": 1, "e": "Mặc dù nữ giới hút thuốc ít hơn, nhưng ung thư phổi vẫn gây tử vong đứng hàng thứ hai do tiên lượng bệnh rất xấu."}, {"q": "Câu 65: \"Gánh nặng bệnh tật\" (Burden of Disease) của ung thư trong một quốc gia thường được đánh giá toàn diện nhất thông qua các chỉ số dịch tễ nào kết hợp?", "a": ["A. Chỉ dựa vào tỷ lệ tử vong", "B. Incidence, Prevalence, Mortality và Survival", "C. Tổng số giường bệnh của khoa ung bướu", "D. Số lượng máy xạ trị có trong nước"], "c": 1, "e": "4 chỉ số dịch tễ cốt lõi này phải được phân tích đồng thời để cung cấp bức tranh đầy đủ về mặt y tế dự phòng và lâm sàng."}, {"q": "Câu 66: Nhận định nào sau đây là SAI về tỷ lệ mới mắc (Incidence)?", "a": ["A. Cung cấp dữ liệu về sự xuất hiện ung thư trong cộng đồng", "B. Giúp dự báo xu hướng mắc bệnh để hoạch định chính sách y tế", "C. Phụ thuộc rất lớn vào yếu tố độ tuổi của tháp dân số", "D. Incidence luôn luôn lớn hơn Prevalence ở những bệnh ung thư mạn tính, sống kéo dài"], "c": 3, "e": "Với các bệnh mạn tính mà bệnh nhân sống lâu, số ca hiện sống tích lũy (Prevalence) lớn hơn rất nhiều so với số ca mới mắc mỗi năm."}, {"q": "Câu 67: Từ góc độ ghi nhận ung thư, nếu một người chuyển từ tỉnh A sang tỉnh B sinh sống và phát hiện ung thư tại tỉnh B, ca bệnh này thường được tính tỷ lệ mắc mới cho khu vực nào trong hệ thống Ghi nhận quần thể?", "a": ["A. Tỉnh B (nơi cư trú hiện tại lúc chẩn đoán)", "B. Tỉnh A (nơi sinh ra)", "C. Tính cho cả hai tỉnh", "D. Bị loại khỏi thống kê"], "c": 0, "e": "Nguyên tắc chuẩn của ghi nhận ung thư là gán bệnh nhân vào địa phương nơi họ khai báo thường trú tại thời điểm chẩn đoán."}, {"q": "Câu 68: Thuật ngữ \"Bướu giáp biên ác\" (Borderline tumor) dùng để chỉ loại tổn thương nào?", "a": ["A. Khối u chắc chắn 100% lành tính", "B. Khối u đã di căn toàn thân", "C. Khối u có đặc điểm mô học nằm trung gian giữa bướu lành và bướu ác tính, tiên lượng thường tốt hơn ung thư xâm lấn", "D. Tổn thương viêm nhiễm giả u"], "c": 2, "e": "Bướu giáp biên có sự tăng sinh tế bào bất thường nhưng chưa phá vỡ màng đáy để xâm lấn mô đệm thực sự."}, {"q": "Câu 69: Tỷ lệ sống còn 5 năm (5-year survival rate) trong ung thư có nghĩa là gì?", "a": ["A. Bệnh nhân chỉ sống được tối đa 5 năm", "B. Phần trăm số bệnh nhân vẫn còn sống ít nhất 5 năm kể từ lúc được chẩn đoán", "C. Thời gian điều trị kéo dài đúng 5 năm", "D. Khối u sẽ biến mất sau 5 năm không cần chữa trị"], "c": 1, "e": "Sống sót qua mốc 5 năm là tiêu chí quan trọng trong ung thư vì phần lớn các ca tái phát thường xảy ra trong khoảng thời gian này."}, {"q": "Câu 70: Yếu tố \"Tôn giáo, hoàn cảnh xã hội\" ảnh hưởng đến tỷ lệ mắc mới ung thư chủ yếu thông qua cơ chế nào?", "a": ["A. Thông qua đột biến gen bẩm sinh", "B. Thông qua sự khác biệt về lối sống, thói quen ăn uống, sinh đẻ, và các hành vi nguy cơ", "C. Vi khuẩn lây qua không khí tại các khu vực tôn giáo", "D. Không có ảnh hưởng gì cả"], "c": 1, "e": "Các quy tắc tôn giáo có thể gián tiếp ảnh hưởng đến nguy cơ ung thư (ví dụ: cấm hút thuốc, cấm ăn thịt lợn, hoặc các nghi thức sinh đẻ)."}, {"q": "Câu 71: Sự gia tăng nhanh chóng số lượng mắc mới (Incidence) ung thư tuyến tiền liệt vào đầu thập niên 1990 ở Mỹ chủ yếu do nguyên nhân nào?", "a": ["A. Đột biến gen hàng loạt ở nam giới", "B. Do sự phổ biến của việc xét nghiệm máu PSA vào chương trình tầm soát thường quy", "C. Do người dân ăn nhiều thịt nướng", "D. Do phơi nhiễm chất độc da cam"], "c": 1, "e": "Việc áp dụng xét nghiệm PSA rộng rãi đã phát hiện ra vô số ca ung thư tuyến tiền liệt tiềm ẩn vốn trước đó không có triệu chứng."}, {"q": "Câu 72: Nếu một phương pháp điều trị mới giúp kéo dài thời gian sống của bệnh nhân ung thư giai đoạn cuối thêm nhiều năm nhưng không chữa khỏi bệnh, điều gì sẽ xảy ra với các chỉ số dịch tễ học?", "a": ["A. Incidence tăng, Mortality giảm", "B. Prevalence tăng, Mortality có thể giảm nhẹ hoặc giữ nguyên, Incidence không đổi", "C. Incidence giảm, Prevalence giảm", "D. Mortality tăng vọt"], "c": 1, "e": "Người bệnh không tử vong ngay mà sống tiếp sẽ cộng dồn vào quần thể bệnh nhân hiện có, làm tăng vọt chỉ số Prevalence."}, {"q": "Câu 73: Trong các thử nghiệm lâm sàng đối với ung thư di căn giai đoạn muộn, tại sao tiêu chí PFS (Sống không tiến triển) thường được dùng làm tiêu chí đánh giá chính thay vì OS (Sống toàn bộ)?", "a": ["A. Vì OS mất quá nhiều thời gian để theo dõi và bị nhiễu bởi các liệu pháp điều trị bước 2, bước 3 sau khi bệnh tiến triển", "B. Vì PFS luôn dài hơn OS", "C. Vì PFS tính cả nguyên nhân tử vong do tai nạn giao thông", "D. Vì bệnh nhân giai đoạn muộn không bao giờ tử vong"], "c": 0, "e": "PFS cho biết chính xác tác dụng của phác đồ đang thử nghiệm, trong khi OS bị thay đổi bởi tất cả các loại thuốc dùng cứu vãn sau đó."}, {"q": "Câu 74: Một quốc gia có dân số đang già hóa đi nhanh chóng. Ngay cả khi các yếu tố nguy cơ cá nhân không đổi, tỷ lệ mắc mới ung thư thô (Crude Incidence Rate) của quốc gia này sẽ diễn biến thế nào?", "a": ["A. Giảm mạnh", "B. Có xu hướng tăng lên do sự gia tăng tỷ trọng nhóm người cao tuổi", "C. Hoàn toàn không thay đổi", "D. Biến mất hoàn toàn"], "c": 1, "e": "Tỷ lệ thô chưa chuẩn hóa phụ thuộc vào tháp tuổi; tuổi thọ trung bình càng cao, số lượng ung thư ghi nhận được trên 100.000 dân càng lớn."}, {"q": "Câu 75: Trong Ghi nhận ung thư, \"Age-Standardized Rate\" (ASR - Tỷ suất mắc chuẩn hóa theo tuổi) được sử dụng nhằm mục đích gì?", "a": ["A. Để che giấu con số thật của người bệnh", "B. Để loại bỏ ảnh hưởng của sự khác biệt về cấu trúc tuổi khi so sánh tỷ lệ mắc/tử vong giữa các quốc gia hoặc các thời kỳ khác nhau", "C. Để tính chi phí điều trị trung bình", "D. Để xác định tuổi thọ của vi-rút gây bệnh"], "c": 1, "e": "ASR mô phỏng một cấu trúc dân số \"chuẩn\" của thế giới, giúp việc so sánh giữa nước dân số trẻ và nước dân số già trở nên công bằng."}, {"q": "Câu 76: Sự thay đổi mô hình ung thư ở Việt Nam trong những năm gần đây (giảm ung thư cổ tử cung, dạ dày; tăng ung thư vú, đại trực tràng) phản ánh quá trình nào trong xã hội?", "a": ["A. Quá trình công nghiệp hóa, đô thị hóa và thay đổi lối sống sang kiểu phương Tây", "B. Do chiến tranh hóa học", "C. Do biến đổi khí hậu làm nóng lên toàn cầu", "D. Do sự suy giảm của tuổi thọ trung bình"], "c": 0, "e": "Lối sống thành thị ít vận động, chế độ ăn nhiều chất béo/thịt đỏ làm tăng các loại ung thư \"phương Tây\" như vú, đại trực tràng."}, {"q": "Câu 77: Tại sao dữ liệu ghi nhận ung thư từ các nước thu nhập thấp và trung bình (LMICs) thường bị đánh giá thấp (Under-reported) trên Globocan?", "a": ["A. Vì người ở các nước này có sức đề kháng tự nhiên với ung thư", "B. Do thiếu hệ thống Ghi nhận ung thư quần thể (PBCR) chất lượng cao và bao phủ rộng", "C. Do WHO không muốn thống kê các nước nghèo", "D. Do virus gây ung thư không tồn tại ở vùng nhiệt đới"], "c": 1, "e": "Rất nhiều bệnh nhân ở LMICs không đến bệnh viện hoặc tử vong tại nhà mà không có chẩn đoán, khiến hệ thống y tế không thể thu thập số liệu."}, {"q": "Câu 78: Khái niệm \"Overdiagnosis\" (Chẩn đoán quá mức) trong các chương trình sàng lọc ung thư được hiểu là gì?", "a": ["A. Bác sĩ chẩn đoán nhầm u lành thành u ác", "B. Sàng lọc phát hiện ra những ung thư rất chậm phát triển, sẽ không bao giờ gây triệu chứng hay đe dọa tính mạng bệnh nhân", "C. Bệnh nhân tự ám thị mình bị ung thư", "D. Máy xét nghiệm bị lỗi kỹ thuật"], "c": 1, "e": "Một số ung thư (như tuyến tiền liệt, tuyến giáp) tiến triển quá chậm, bệnh nhân thường tử vong vì nguyên nhân khác trước khi u này gây hại."}, {"q": "Câu 79: Trong phân tích kết quả thử nghiệm lâm sàng, \"Trung vị thời gian sống thêm\" (Median survival) có thể \"chưa đạt được\" (Not reached) vào thời điểm báo cáo dữ liệu. Điều này có ý nghĩa gì?", "a": ["A. Thuốc thất bại hoàn toàn, bệnh nhân chết hết trong ngày đầu", "B. Thử nghiệm bị hủy bỏ do hết kinh phí", "C. Hơn 50% số bệnh nhân trong nhóm nghiên cứu vẫn còn sống tại thời điểm phân tích dữ liệu", "D. Bác sĩ quên không thu thập dữ liệu"], "c": 2, "e": "Do chưa có quá nửa số bệnh nhân tử vong nên đường cong Kaplan-Meier chưa cắt ngang mốc 50%, đây là dấu hiệu điều trị rất thành công."}, {"q": "Câu 80: Tính chất \"Bất tử\" (Immortal) của tế bào ung thư trong nuôi cấy in vitro (như dòng tế bào HeLa) liên quan trực tiếp đến cơ chế phân tử nào?", "a": ["A. Sản xuất quá mức Melanin", "B. Khả năng tự tổng hợp kháng sinh", "C. Sự tái hoạt động của enzyme Telomerase, giúp duy trì độ dài của telomere ở đuôi nhiễm sắc thể", "D. Màng tế bào làm bằng sừng keratin siêu cứng"], "c": 2, "e": "Telomerase nối dài phần đầu mút nhiễm sắc thể sau mỗi lần phân chia, giúp tế bào ung thư thoát khỏi quá trình lão hóa sinh học."}, {"q": "Câu 81: Quốc gia nào có tỷ lệ mắc ung thư gan (HCC) cao nhất thế giới do tỷ lệ đồng nhiễm HBV, HCV và HDV rất cao?", "a": ["A. Ấn Độ", "B. Hoa Kỳ", "C. Mông Cổ", "D. Nhật Bản"], "c": 2, "e": "Dữ liệu Globocan ghi nhận Mông Cổ là điểm nóng thế giới về ung thư gan do gánh nặng bệnh lý viêm gan virus mạn tính."}, {"q": "Câu 82: Đặc điểm dịch tễ của ung thư biểu mô tế bào gan (HCC) về giới tính là gì?", "a": ["A. Nam và Nữ có tỷ lệ mắc bằng nhau", "B. Nữ mắc bệnh nhiều gấp 2-3 lần Nam", "C. Nam mắc bệnh nhiều gấp 2-3 lần Nữ", "D. Chỉ xuất hiện ở Nam giới"], "c": 2, "e": "Nam giới phơi nhiễm nhiều hơn với các yếu tố nguy cơ như uống rượu bia, hút thuốc lá và viêm gan virus mạn tính."}, {"q": "Câu 83: Trong số các loại virus viêm gan, virus nào là nguyên nhân phổ biến nhất gây xơ gan và ung thư gan tại Việt Nam?", "a": ["A. HAV (Viêm gan A)", "B. HBV (Viêm gan B)", "C. HEV (Viêm gan E)", "D. Rhinovirus"], "c": 1, "e": "Việt Nam nằm trong vùng dịch tễ nhiễm Viêm gan B cao, chiếm phần lớn nguyên nhân gây xơ gan và ung thư tế bào gan nguyên phát."}, {"q": "Câu 84: Độc tố Aflatoxin gây ung thư gan thường có nguồn gốc từ đâu?", "a": ["A. Khí thải công nghiệp", "B. Nấm mốc Aspergillus flavus trên các loại ngũ cốc, ngô, đậu phộng bị ẩm", "C. Hóa chất trừ sâu trong rau quả tươi", "D. Virus lây qua đường tình dục"], "c": 1, "e": "Nấm mốc ở nông sản bảo quản kém tiết ra Aflatoxin B1, một chất độc hấp thụ vào gan và gây đột biến tế bào."}, {"q": "Câu 85: Ở bệnh nhân ung thư gan, dấu ấn khối u (Tumor marker) thường được xét nghiệm trong máu là gì?", "a": ["A. CA 15-3", "B. PSA", "C. AFP (Alpha-fetoprotein)", "D. CA 125"], "c": 2, "e": "AFP là một protein sinh ra nhiều ở thời kỳ bào thai, nồng độ chất này sẽ tăng mạnh khi tế bào gan bị ung thư hóa."}, {"q": "Câu 86: Giá trị AFP tăng trên ngưỡng bao nhiêu được xem là gợi ý có giá trị chẩn đoán ung thư biểu mô tế bào gan?", "a": ["A. $>5~ng/ml$", "B. $>20~ng/ml$", "C. $>400~ng/ml$", "D. $>10.000~ng/ml$"], "c": 2, "e": "Ngưỡng $400~ng/ml$ có giá trị tiên đoán dương tính rất cao đối với HCC, kết hợp với hình ảnh học điển hình giúp xác định chẩn đoán."}, {"q": "Câu 87: Phương tiện chẩn đoán hình ảnh nào có vai trò quan trọng, đơn giản và rẻ tiền nhất trong việc TẦM SOÁT ung thư gan ở nhóm nguy cơ cao?", "a": ["A. Chụp PET/CT", "B. Chụp cộng hưởng từ (MRI)", "C. Chụp cắt lớp vi tính (CT scan)", "D. Siêu âm ổ bụng"], "c": 3, "e": "Siêu âm không nhiễm xạ, chi phí thấp, được chỉ định lặp lại mỗi 3-6 tháng để phát hiện khối u gan nhỏ mới khởi phát."}, {"q": "Câu 88: Tiên lượng của ung thư gan (HCC) nhìn chung được đánh giá như thế nào?", "a": ["A. Rất tốt, tỷ lệ chữa khỏi đạt 100%", "B. Kém, ngay cả ở các nước phát triển, tỷ lệ sống sau 5 năm nhìn chung thấp", "C. Rất tốt nếu chỉ dùng thuốc nam", "D. Chỉ gây tử vong ở người trên 80 tuổi"], "c": 1, "e": "Đa phần ung thư gan phát hiện ở giai đoạn muộn trên nền tảng bệnh nhân đã bị xơ gan, khiến điều trị cực kỳ khó khăn."}, {"q": "Câu 89: Phương pháp điều trị nào có khả năng chữa khỏi triệt để (Curative) đối với ung thư gan khối u nhỏ, khu trú và chức năng gan còn tốt?", "a": ["A. Phẫu thuật cắt gan", "B. Hóa trị toàn thân bằng Sorafenib", "C. Truyền nước biển (Dịch truyền)", "D. Đốt u bằng laser ngoài da"], "c": 0, "e": "Cắt bỏ hoàn toàn thùy/phân thùy gan chứa khối u hoặc ghép gan là những liệu pháp duy nhất mang lại hy vọng sống lâu dài triệt căn."}, {"q": "Câu 90: Virus viêm gan C (HCV) lây truyền chủ yếu qua đường nào?", "a": ["A. Đường ăn uống chung bát đũa", "B. Qua muỗi đốt", "C. Đường máu (như tiêm chích ma túy, truyền máu không an toàn)", "D. Hắt hơi, ho"], "c": 2, "e": "HCV lây truyền qua tiếp xúc máu-máu, do đó việc kiểm soát nguồn máu và sử dụng kim tiêm sạch là biện pháp phòng ngừa quan trọng."}, {"q": "Câu 91: Tiêm vaccine Viêm gan B (HBV) thuộc cấp độ dự phòng nào đối với ung thư gan?", "a": ["A. Dự phòng cấp 1", "B. Dự phòng cấp 2", "C. Dự phòng cấp 3", "D. Dự phòng cấp 4"], "c": 0, "e": "Vaccine tạo kháng thể ngăn ngừa sự nhiễm virus ngay từ ban đầu ở người chưa có bệnh, hoàn toàn thuộc dự phòng cấp 1."}, {"q": "Câu 92: Triệu chứng lâm sàng của ung thư gan giai đoạn sớm thường có đặc điểm gì?", "a": ["A. Bệnh nhân đau bụng quằn quại", "B. Rất nghèo nàn, khó phát hiện, thường không có triệu chứng", "C. Da vàng sậm ngay từ đầu", "D. Ho ra máu liên tục"], "c": 1, "e": "Nhu mô gan không có dây thần kinh cảm giác, do đó khối u nhỏ phát triển im lặng, không gây đau đớn hay vàng da."}, {"q": "Câu 93: Một bệnh nhân được sờ thấy khối u rắn lổn nhổn ở vùng hạ sườn phải kèm theo báng bụng. Đây là biểu hiện của ung thư gan ở giai đoạn nào?", "a": ["A. Giai đoạn rất sớm", "B. Giai đoạn tiền lâm sàng", "C. Giai đoạn muộn", "D. Giai đoạn viêm gan cấp"], "c": 2, "e": "Báng bụng, vàng da, khối u sờ rõ trên lâm sàng là dấu hiệu u đã rất lớn, suy tế bào gan và xâm lấn/di căn."}, {"q": "Câu 94: Nhóm thuốc mới DAA (Direct-acting antiviral) mang lại hiệu quả vượt trội trong điều trị triệt để loại virus viêm gan nào?", "a": ["A. HBV", "B. HCV", "C. HAV", "D. HDV"], "c": 1, "e": "Các thuốc kháng virus tác động trực tiếp (DAA) có khả năng loại trừ hoàn toàn virus viêm gan C với tỷ lệ thành công trên 95%."}, {"q": "Câu 95: Bệnh lý chuyển hóa nào sau đây làm tăng nguy cơ mắc ung thư gan (HCC) không do rượu?", "a": ["A. Bệnh gút (Gout)", "B. Béo phì và bệnh gan nhiễm mỡ không do rượu (NAFLD/NASH)", "C. Loãng xương", "D. Basedow (Cường giáp)"], "c": 1, "e": "Tích tụ mỡ ở gan gây viêm hoại tử và xơ hóa mô gan, tạo môi trường viêm mạn tính kích thích phát sinh ung thư."}, {"q": "Câu 96: Dấu hiệu hình ảnh học \"điển hình\" của ung thư biểu mô tế bào gan (HCC) trên CT scan cản quang hoặc MRI có tương phản là gì?", "a": ["A. Bắt thuốc dần dần từ ngoài vào trong ở thì tĩnh mạch", "B. Không bắt thuốc ở bất kỳ thì nào, tạo thành bóng đen", "C. Tăng bắt thuốc mạnh ở thì động mạch và thải thuốc nhanh (wash-out) ở thì tĩnh mạch hay thì muộn", "D. Hình ảnh vôi hóa lan tỏa toàn bộ khối u"], "c": 2, "e": "Khối u gan ác tính được nuôi dưỡng hoàn toàn bởi động mạch gan nên bắt thuốc sáng rực ngay thì động mạch và thoát thuốc nhanh sau đó."}, {"q": "Câu 97: Ngoài AFP, các dấu ấn sinh học (biomarkers) nào sau đây được kết hợp để tăng độ chính xác trong tầm soát và chẩn đoán HCC?", "a": ["A. CEA và CA 19-9", "B. AFP-L3 và PIVKA II", "C. PSA và CA 125", "D. hCG và Calcitonin"], "c": 1, "e": "Bộ 3 xét nghiệm (Triple test: AFP, AFP-L3, PIVKA II) giúp chẩn đoán nhạy bén hơn các khối u ác tính ngay khi AFP còn thấp."}, {"q": "Câu 98: Phân biệt nồng độ AFP tăng do ung thư gan với tăng do viêm gan lành tính thường dựa vào tỷ lệ của chất nào?", "a": ["A. Bilirubin trực tiếp", "B. Men gan (AST, ALT)", "C. AFP-L3 (Ngưỡng giá trị bình thường là 5%)", "D. Albumin máu"], "c": 2, "e": "AFP-L3 là đồng phân đặc hiệu sinh ra từ tế bào ác tính; nếu phần trăm phân đoạn này cao (trên 5%) thì nghĩ nhiều đến ung thư."}, {"q": "Câu 99: Phương pháp TACE (Nút mạch hóa chất) thường được chỉ định cho bệnh nhân ung thư gan ở giai đoạn nào theo phân loại BCLC?", "a": ["A. Giai đoạn rất sớm (Very early - BCLC 0)", "B. Giai đoạn trung gian (Intermediate - BCLC B) có khối u đa ổ nhưng chưa xâm lấn tĩnh mạch cửa", "C. Giai đoạn cuối (Terminal - BCLC D) gan đã suy kiệt", "D. Bất kỳ giai đoạn nào"], "c": 1, "e": "TACE dùng vật liệu làm tắc mạch máu nuôi u kết hợp bơm hóa chất diệt tế bào, phù hợp nhất với u đa ổ không thể cắt bỏ ở giai đoạn B."}, {"q": "Câu 100: Chỉ định \"Tiêu chuẩn vàng\" để chẩn đoán xác định ung thư gan, nhưng thường chỉ được thực hiện khi hình ảnh học không điển hình là gì?", "a": ["A. Siêu âm đàn hồi mô gan", "B. Xét nghiệm máu tìm virus", "C. Sinh thiết gan", "D. Nội soi dạ dày"], "c": 2, "e": "Giải phẫu bệnh từ mẫu sinh thiết là bằng chứng vàng chắc chắn nhất, nhưng chỉ dùng khi các phương pháp không xâm lấn chưa đủ tiêu chuẩn chẩn đoán."}, {"q": "Câu 101: Đối tượng nào được xếp vào nhóm \"nguy cơ rất cao\" cần tầm soát ung thư gan mỗi 3 tháng một lần?", "a": ["A. Người thỉnh thoảng uống rượu", "B. Xơ gan có liên quan đến viêm gan do virus (HBV, HCV)", "C. Trẻ em mới sinh ra từ mẹ nhiễm HBV", "D. Người bị gan nhiễm mỡ đơn thuần độ 1"], "c": 1, "e": "Tổn thương xơ gan kết hợp virus là nền tảng dễ chuyển dạng ung thư nhất, khối u có thể phát triển cực nhanh nên cần theo dõi mỗi 3 tháng."}, {"q": "Câu 102: Yếu tố \"Huyết khối tĩnh mạch cửa\" trong ung thư gan làm thay đổi tiên lượng bệnh như thế nào và đưa bệnh nhân vào giai đoạn nào của BCLC?", "a": ["A. Không ảnh hưởng, bệnh nhân vẫn ở giai đoạn sớm", "B. Cho thấy bệnh tiến triển, đưa bệnh nhân vào giai đoạn tiến xa (Advanced stage - BCLC C)", "C. Là dấu hiệu tốt vì khối u bị tự tắc mạch máu", "D. Đưa bệnh nhân vào giai đoạn rất sớm (BCLC 0)"], "c": 1, "e": "Huyết khối chứng tỏ tế bào u đã xâm nhập vào mạch máu lớn, nguy cơ di căn hệ thống cực cao, làm xấu đi tiên lượng."}, {"q": "Câu 103: Sorafenib và Lenvatinib là các loại thuốc thuộc nhóm nào, được ưu tiên chỉ định cho ung thư gan giai đoạn muộn (BCLC C)?", "a": ["A. Hóa chất truyền tĩnh mạch cổ điển", "B. Liệu pháp miễn dịch tế bào T", "C. Thuốc nhắm trúng đích phân tử (Ức chế đa kinase)", "D. Thuốc kháng sinh diệt nấm"], "c": 2, "e": "Đây là các loại thuốc đường uống, tác động ức chế sự sinh mạch máu khối u và sự nhân lên của tế bào ung thư ở giai đoạn tiến xa."}, {"q": "Câu 104: Mối liên hệ cộng gộp giữa uống nhiều rượu (Alcohol) và ung thư gan được thể hiện qua con số nào theo các nghiên cứu dịch tễ?", "a": ["A. Rượu chỉ gây xơ gan chứ không gây ung thư", "B. Tiêu thụ nhiều alcohol làm tăng khoảng 87% nguy cơ mắc HCC, nếu kết hợp với viêm gan virus có thể tăng nguy cơ gấp 5 lần", "C. Rượu tiêu diệt virus viêm gan nên làm giảm nguy cơ ung thư", "D. Phải uống trên 20 ly/ngày mới tăng nguy cơ ung thư gan"], "c": 1, "e": "Cồn chuyển hóa ở gan sinh ra các gốc tự do gây viêm, thúc đẩy nhanh quá trình xơ gan và đột biến DNA, đặc biệt khi có mặt virus."}, {"q": "Câu 105: Sự hiện diện của kháng nguyên HBeAg dương tính ở bệnh nhân viêm gan B mạn tính phản ánh điều gì đối với nguy cơ ung thư gan?", "a": ["A. Thể hiện nồng độ virus thấp, ít nguy cơ ung thư", "B. Phản ánh tình trạng virus đang nhân lên mạnh mẽ (Elevated viral load), gia tăng đáng kể nguy cơ xơ gan và ung thư gan", "C. Bệnh nhân đã hoàn toàn miễn dịch với viêm gan B", "D. Chỉ điểm ung thư đã di căn phổi"], "c": 1, "e": "HBeAg (+) cho thấy sự hoạt động nhân đôi mạnh của virus, phá hủy mô gan diện rộng và thúc đẩy quá trình sinh ung."}, {"q": "Câu 106: Chỉ số \"Performance Status\" (PS) theo ECOG mức độ 1 được mô tả là gì?", "a": ["A. Hoàn toàn khỏe mạnh, hoạt động bình thường như trước khi bệnh", "B. Bệnh nhân hoàn toàn nằm liệt giường", "C. Hạn chế làm việc nặng nhưng có thể đi lại tự do và làm các việc nhẹ nhàng (như việc nhà nhẹ, việc văn phòng)", "D. Nằm trên giường trên 50% thời gian thức"], "c": 2, "e": "Bệnh nhân ECOG 1 có thể không lao động chân tay được nhưng vẫn tự sinh hoạt cá nhân và làm việc văn phòng bình thường."}, {"q": "Câu 107: Trong các phương pháp phá hủy khối u tại chỗ, kỹ thuật RFA hoạt động dựa trên nguyên lý nào?", "a": ["A. Đốt lạnh khối u bằng nitơ lỏng", "B. Tiêm cồn tuyệt đối vào mạch máu khối u", "C. Sinh nhiệt để hoại tử khối u bằng dòng điện xoay chiều có tần số sóng radio", "D. Chiếu tia X liều cao từ ngoài vào"], "c": 2, "e": "RFA (Đốt u sóng cao tần) tạo nhiệt lượng làm đông vón protein, tiêu diệt hoàn toàn mô ung thư ngay tại chỗ bằng một cây kim dẫn nhiệt."}, {"q": "Câu 108: Việc sử dụng các biện pháp kiểm soát sinh học (biocontrol) bằng các chủng nấm Aspergillus không sinh độc tố cạnh tranh trên đồng ruộng là chiến lược nhằm giảm thiểu yếu tố nguy cơ nào?", "a": ["A. Viêm gan A", "B. Dư lượng thuốc trừ sâu", "C. Aflatoxins", "D. Kim loại nặng trong đất"], "c": 2, "e": "Nấm lành tính sẽ cạnh tranh môi trường sống và kìm hãm nấm sinh độc phát triển trên ngô, đậu phộng, giúp cắt đứt nguồn Aflatoxin."}, {"q": "Câu 109: Trong thang điểm Child-Pugh, bệnh nhân được xếp vào Class A (chức năng gan còn tốt) khi có tổng số điểm là bao nhiêu?", "a": ["A. 1 - 4 điểm", "B. 5 - 6 điểm", "C. 7 - 9 điểm", "D. 10 - 15 điểm"], "c": 1, "e": "Nhóm Child-Pugh A (5-6 điểm) tiên lượng chức năng gan dự trữ bảo tồn tốt, an toàn để tiến hành các phẫu thuật cắt gan."}, {"q": "Câu 110: Phương pháp SIRT (Selective Internal Radiation Therapy) trong điều trị ung thư gan có bản chất là gì?", "a": ["A. Xạ trị chiếu ngoài bằng máy gia tốc", "B. Bơm các hạt vi cầu phóng xạ (thường là Yttrium-90) qua đường động mạch gan để tiêu diệt khối u tại chỗ", "C. Uống dung dịch lỏng I-ốt 131", "D. Phẫu thuật mổ hở cấy hạt phóng xạ vào gan"], "c": 1, "e": "SIRT là xạ trị chiếu trong, hạt phóng xạ sẽ mắc kẹt tại vi mạch nuôi u và chiếu bức xạ trực tiếp để tiêu diệt u, hạn chế tổn thương gan lành."}, {"q": "Câu 111: Sự tiếp xúc với Aflatoxin B1 ở người gây sinh ung thư gan thông qua một dạng đột biến gen đặc trưng nào?", "a": ["A. Đột biến MSH2", "B. Đột biến trên gen Tp53 (đặc biệt là đột biến điểm R249S)", "C. Đột biến gen BRCA1", "D. Khuếch đại gen HER2"], "c": 1, "e": "Aflatoxin B1 tác động lên DNA tạo ra liên kết cộng hóa trị với Guanine, đặc hiệu gây đột biến điểm R249S trên gen ức chế u Tp53."}, {"q": "Câu 112: Ngoài đột biến DNA, phơi nhiễm Aflatoxin còn gây ra những thay đổi ở cấp độ Epigenetics (ngoại di truyền) nào trong tế bào gan?", "a": ["A. Phá vỡ trực tiếp màng nhân tế bào", "B. Thay đổi sự methyl hóa promoter (như hypermethylation ở các gen ức chế u RASSF1A) và biểu hiện RNA không mã hóa (microRNA)", "C. Tiêu hủy hoàn toàn lượng RNA trong tế bào", "D. Làm đông vón protein trong bào tương"], "c": 1, "e": "Độc tố này tác động biểu sinh (Epigenetics) làm \"khóa\" hoạt động của các gen ức chế ung thư mà không cần thay đổi trình tự chuỗi DNA."}, {"q": "Câu 113: Theo BCLC 2022, bệnh nhân ung thư gan có huyết khối tĩnh mạch cửa, chức năng gan bảo tồn (Child-Pugh A), và PS 1-2. Chiến lược điều trị bước 1 (First-line) được ưu tiên nhất hiện nay là gì?", "a": ["A. Cắt gan bán phần", "B. Nút mạch TACE", "C. Điều trị toàn thân (Thuốc nhắm trúng đích hoặc Liệu pháp miễn dịch)", "D. Ghép gan"], "c": 2, "e": "Bệnh nhân thuộc giai đoạn tiến xa (BCLC C) do xâm lấn mạch máu, chỉ định chuẩn nhất để sống còn dài hơn là liệu pháp toàn thân."}, {"q": "Câu 114: Một bệnh nhân có khối u gan kích thước 2 cm, chức năng gan rất tốt (Child-Pugh A), sức khỏe toàn trạng bình thường (PS 0). Theo hệ thống BCLC, phương pháp điều trị tối ưu là gì?", "a": ["A. Giai đoạn tiến xa (C) -> Dùng Sorafenib", "B. Giai đoạn rất sớm (0) -> Phẫu thuật cắt gan hoặc Đốt u (RFA/MWA)", "C. Giai đoạn trung gian (B) -> TACE", "D. Giai đoạn cuối (D) -> Chăm sóc giảm nhẹ"], "c": 1, "e": "Khối u nhỏ đơn độc dưới 2cm thuộc nhóm rất sớm (BCLC 0), ưu tiên điều trị mang tính triệt căn (Curative) như cắt bỏ hoặc đốt sóng."}, {"q": "Câu 115: Về mặt dịch tễ học, việc thực hiện chương trình tiêm chủng vaccine viêm gan B đã tạo ra tác động rõ rệt nhất là gì đối với ung thư gan (ví dụ tại Đài Loan)?", "a": ["A. Không làm giảm tỷ lệ ung thư gan, chỉ giảm tỷ lệ viêm gan cấp", "B. Làm giảm đáng kể cả tỷ lệ mới mắc (incidence) và tỷ lệ tử vong (mortality) do ung thư gan ở thế hệ trẻ được tiêm chủng", "C. Gây tăng tỷ lệ tự miễn ở gan", "D. Tiêu diệt hoàn toàn Aflatoxin trong cơ thể"], "c": 1, "e": "Vaccine HBV là loại vaccine ngừa ung thư đầu tiên trên thế giới chứng minh được hiệu quả cắt đứt chuỗi lây nhiễm và sinh u thực tế."}, {"q": "Câu 116: Thuật ngữ \"DEB-TACE\" trong điều trị can thiệp ung thư gan chỉ phương pháp nào?", "a": ["A. Nút mạch bằng Lipiodol thông thường", "B. Nút mạch sử dụng các hạt vi cầu (beads) ngậm hóa chất giải phóng chậm, giúp tăng nồng độ thuốc tại u", "C. Đốt u bằng sóng vi ba", "D. Truyền hóa chất động mạch gan liên tục"], "c": 1, "e": "Kỹ thuật Drug-Eluting Beads (DEB) nhốt hóa chất vào các hạt tắc mạch, giúp thuốc ngấm dần vào khối u thay vì trôi vào máu hệ thống."}, {"q": "Câu 117: Ở người mang vi-rút HBV mạn, nồng độ Adiponectin huyết tương trong bệnh cảnh béo phì có liên quan như thế nào với quá trình sinh ung thư?", "a": ["A. Nồng độ adiponectin cao có liên quan đến tỷ lệ đào thải HBsAg thấp hơn và mức HBV DNA tồn tại cao hơn, gia tăng nguy cơ xơ gan và HCC", "B. Adiponectin có tác dụng kháng virus trực tiếp, bảo vệ gan khỏi ung thư", "C. Adiponectin đóng vai trò làm teo mô mỡ, không liên quan đến gan", "D. Nồng độ Adiponectin không bị ảnh hưởng bởi béo phì"], "c": 0, "e": "Rối loạn hormone từ mô mỡ này làm giảm sức đề kháng của cơ thể với virus, kích thích tình trạng viêm mạn tính dai dẳng tại gan."}, {"q": "Câu 118: Cấu tạo của chiến lược SAFER của WHO để kiểm soát tiêu thụ rượu bia gồm các thành tố nào?", "a": ["A. Chỉ gồm việc đánh thuế nặng các loại đồ uống có cồn", "B. Hạn chế tính sẵn có; chống lái xe khi say; can thiệp y tế; cấm quảng cáo; và tăng giá/thuế", "C. Phân phát rượu miễn phí để người dân chán không uống nữa", "D. Yêu cầu pha loãng tất cả các loại rượu"], "c": 1, "e": "SAFER là công cụ tổng hợp 5 biện pháp (từ luật pháp, tài chính đến y tế và truyền thông) để thu hẹp thiệt hại của đồ uống có cồn."}, {"q": "Câu 119: Phác đồ SOF/VEL (Sofosbuvir/Velpatasvir) hoặc G/P (Glecaprevir/Pibrentasvir) được WHO khuyến cáo trong điều trị viêm gan C có đặc tính nổi bật nào?", "a": ["A. Phải kết hợp với tiêm Interferon và có rất nhiều tác dụng phụ", "B. Là các phác đồ DAA \"Pangenotypic\" (Tác dụng trên tất cả các genotype của HCV), dùng đường uống, hiệu quả cao, thời gian ngắn", "C. Thời gian điều trị kéo dài ít nhất 2 năm", "D. Chỉ dùng để điều trị giảm nhẹ cho bệnh nhân xơ gan giai đoạn cuối"], "c": 1, "e": "DAA pangenotypic loại bỏ hoàn toàn việc phải xác định type virus phức tạp, giúp việc kê đơn trở nên dễ dàng và rộng rãi cho toàn dân."}, {"q": "Câu 120: Theo sơ đồ chẩn đoán của Bộ Y tế (2020), nếu một khối u gan có hình ảnh CT/MRI không điển hình và/hoặc hình ảnh điển hình nhưng AFP không tăng, bước xử trí tiếp theo được ưu tiên là gì?", "a": ["A. Mổ cắt gan ngay lập tức", "B. Trả bệnh nhân về nhà vì không phải ung thư", "C. Tiến hành sinh thiết khối u gan để chẩn đoán xác định bằng giải phẫu bệnh", "D. Dùng hóa chất đường toàn thân theo kinh nghiệm"], "c": 2, "e": "Nếu các tiêu chuẩn chẩn đoán hình ảnh và marker không đầy đủ độ đặc hiệu, sinh thiết là bắt buộc để tránh cắt lầm u lành tính."}];
        let currentIdx = 0;
        let score = 0;
        let answered = false;

        function initJumpSelect() {
            const select = document.getElementById('jump-select');
            quizData.forEach((_, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                opt.text = `Câu ${idx + 1}`;
                select.appendChild(opt);
            });
        }

        function jumpToQuestion() {
            const select = document.getElementById('jump-select');
            currentIdx = parseInt(select.value);
            loadQuestion();
        }

        function loadQuestion() {
            const q = quizData[currentIdx];
            document.getElementById('q-text').innerText = `Câu ${currentIdx + 1}: ${q.q.replace(/Câu \d+:\s*/, '')}`;
            document.getElementById('question-count').innerText = `Câu ${currentIdx + 1} / ${quizData.length}`;
            document.getElementById('progress-fill').style.width = `${((currentIdx + 1) / quizData.length) * 100}%`;
            document.getElementById('jump-select').value = currentIdx;
            
            const list = document.getElementById('options-list');
            list.innerHTML = '';
            
            const expBox = document.getElementById('explanation-box');
            expBox.style.display = 'none';
            expBox.innerHTML = '';
            
            answered = false;
            document.getElementById('next-btn').disabled = true;

            q.a.forEach((opt, i) => {
                const div = document.createElement('div');
                div.className = 'option';
                div.innerText = opt;
                div.onclick = () => checkAnswer(div, i);
                list.appendChild(div);
            });
        }

        function checkAnswer(el, idx) {
            if (answered) return;
            answered = true;
            const correctIdx = quizData[currentIdx].c;
            
            if (idx === correctIdx) {
                el.classList.add('correct');
                score++;
            } else {
                el.classList.add('wrong');
                const options = document.querySelectorAll('.option');
                if(options[correctIdx]) {
                    options[correctIdx].classList.add('correct');
                }
            }
            
            // Hiển thị phần giải thích từ file Word của user
            const expText = quizData[currentIdx].e;
            if (expText && expText.trim() !== "") {
                const expBox = document.getElementById('explanation-box');
                expBox.innerHTML = `💡 <b>Giải thích:</b><br>${expText}`;
                expBox.style.display = 'block';
            }
            
            document.getElementById('score-display').innerText = `Đúng: ${score}`;
            document.getElementById('next-btn').disabled = false;
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            const screen = document.getElementById('result-screen');
            screen.style.display = 'block';
            document.getElementById('final-result').innerText = `${score}/${quizData.length}`;
            
            const percent = (score / quizData.length) * 100;
            let msg = "";
            if (percent >= 90) msg = "Quá xuất sắc! Bạn là bậc thầy Ung Thư học.";
            else if (percent >= 70) msg = "Rất tốt! Bạn nắm kiến thức chuyên ngành rất vững.";
            else if (percent >= 50) msg = "Tạm ổn, hãy ôn kỹ hơn các phần bệnh học bị sai nhé.";
            else msg = "Bạn cần cố gắng nhiều hơn để vượt qua môn này.";
            document.getElementById('feedback').innerText = msg;
        }

        if(quizData.length > 0) {
            initJumpSelect();
            loadQuestion();
        } else {
            document.getElementById('q-text').innerText = "Không tìm thấy câu hỏi nào.";
        }
    </script>

</html>
