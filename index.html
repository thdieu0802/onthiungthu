
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ôn Thi">
<meta name="theme-color" content="#16a085">
<link rel="manifest" href="manifest.json">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ôn Thi Ung Thư Học</title>
    <style>
        :root {
            --primary: #2980b9;
            --secondary: #2c3e50;
            --success: #27ae60;
            --info: #f39c12;
            --bg: #ecf0f1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            
            /* CHẶN BÔI ĐEN COPY THEO YÊU CẦU */
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        .app-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 20px;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        header {
            background: var(--primary);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.4rem; letter-spacing: 1px;}
        .progress-bar {
            height: 10px;
            background: #bdc3c7;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: var(--success);
            width: 0%;
            transition: width 0.3s;
        }
        .question-section { flex-grow: 1; }
        .question-text {
            font-size: 1.15rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: var(--secondary);
            line-height: 1.4;
        }
        .options { display: flex; flex-direction: column; gap: 12px; }
        .option {
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            line-height: 1.4;
            font-size: 1.05rem;
            background-color: #fff;
        }
        .option:hover { background: #f0f0f0; }
        .option.correct { background: #d4edda; border-color: #28a745; color: #155724; font-weight: bold; }
        .option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
        
        /* PHẦN GIẢI THÍCH */
        #explanation-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #fff8e1;
            border-left: 5px solid var(--info);
            border-radius: 5px;
            font-size: 1rem;
            color: #b9770e;
            line-height: 1.5;
            animation: fadeIn 0.5s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .footer-nav {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: var(--secondary);
            color: white;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: background 0.3s;
        }
        button:hover { background: #1a252f; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #score-display { font-weight: bold; color: var(--primary); font-size: 1.1rem;}
        #result-screen { display: none; text-align: center; flex-grow: 1; }
        
        .jump-container { margin-top: 15px; text-align: center; font-weight: bold;}
        .jump-container select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 1rem; width: 60%;}
        
        .creator-badge {
            text-align: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 2px dashed #ecf0f1;
            font-size: 0.95rem;
            color: #7f8c8d;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="quiz-screen">
            <header>
                <h1>ÔN THI UNG THƯ HỌC</h1>
            </header>
            <div class="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <div class="footer-nav">
                <span id="question-count" style="font-weight: bold; color: #555;">Câu 1 / --</span>
                <span id="score-display">Đúng: 0</span>
            </div>
            
            <div class="jump-container">
                <label style="color: #666;">Chuyển nhanh: </label>
                <select id="jump-select" onchange="jumpToQuestion()"></select>
            </div>
            <hr style="border: 0; height: 1px; background: #eee; margin: 20px 0;">
            
            <div class="question-section">
                <div id="q-text" class="question-text">Đang tải...</div>
                <div id="options-list" class="options"></div>
                <!-- Div hiển thị giải thích -->
                <div id="explanation-box"></div>
            </div>
            <div class="footer-nav" style="justify-content: center; margin-top: 30px;">
                <button id="next-btn" onclick="nextQuestion()" disabled style="width: 100%;">Câu tiếp theo &rarr;</button>
            </div>
        </div>

        <div id="result-screen">
            <h2 style="color: var(--primary); margin-top: 40px;">Hoàn Thành Bài Thi!</h2>
            <div style="font-size: 4rem; margin: 20px 0; color: var(--success); font-weight: 800;" id="final-result"></div>
            <p id="feedback" style="font-size: 1.2rem; color: #555; margin-bottom: 30px;"></p>
            <button onclick="location.reload()" style="background: var(--primary); width: 100%; padding: 15px;">Làm lại từ đầu</button>
        </div>
        
        <!-- Dấu ấn người tạo app -->
        <div class="creator-badge">
            © @THDieu
        </div>
    </div>

    <script>
        // CHẶN CHUỘT PHẢI VÀ PHÍM TẮT COPY
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('copy', event => event.preventDefault());
        document.addEventListener('cut', event => event.preventDefault());
        document.addEventListener('paste', event => event.preventDefault());

        const quizData = [{"q": "Câu 1: Chẩn đoán xác định bệnh ung thư chủ yếu dựa vào phương pháp nào?", "a": ["A. Khám lâm sàng", "B. Siêu âm và X-quang", "C. Mô bệnh học", "D. Xét nghiệm sinh hóa máu"], "c": 2, "e": "Chẩn đoán mô bệnh học (giải phẫu bệnh) là tiêu chuẩn vàng để xác định chính xác bản chất ung thư."}, {"q": "Câu 2: Mục đích chính của chẩn đoán giai đoạn ung thư là gì?", "a": ["A. Sơ bộ hướng đến một ung thư", "B. Đánh giá sự xâm lấn và lan tràn của ung thư", "C. Phát hiện sớm các triệu chứng báo hiệu", "D. Tìm nguyên nhân lây nhiễm gây ung thư"], "c": 1, "e": "Chẩn đoán giai đoạn giúp đánh giá mức độ lan rộng (TNM) để tiên lượng và lập kế hoạch điều trị."}, {"q": "Câu 3: Triệu chứng báo hiệu ung thư thường có đặc điểm gì?", "a": ["A. Rầm rộ, rõ ràng", "B. Cấp tính, đau dữ dội", "C. Nghèo nàn, ít đặc hiệu, dễ bị bỏ qua", "D. Luôn kèm theo sốt cao"], "c": 2, "e": "Ở giai đoạn sớm, ung thư thường diễn tiến âm thầm, triệu chứng mờ nhạt nên người bệnh thường chủ quan."}, {"q": "Câu 4: Hội chứng suy mòn (Cachexia) trong ung thư đặc trưng bởi hiện tượng nào?", "a": ["A. Tích tụ mỡ thừa ở vùng bụng", "B. Cơ thể tự sử dụng cơ và mỡ của chính mình để làm năng lượng", "C. Phù nề toàn thân do tích nước", "D. Phì đại các khớp xương"], "c": 1, "e": "Khối u tiết ra các chất làm thay đổi chuyển hóa, khiến cơ thể tự tiêu hủy cơ và mỡ gây sụt cân nghiêm trọng."}, {"q": "Câu 5: Chữ \"T\" trong hệ thống phân loại TNM có ý nghĩa gì?", "a": ["A. Tình trạng di căn xa (Metastasis)", "B. Tình trạng hạch bạch huyết (Node)", "C. Tình trạng khối u nguyên phát (Tumor)", "D. Phương pháp điều trị (Treatment)"], "c": 2, "e": "T (Tumor) dùng để đánh giá kích thước và mức độ xâm lấn tại chỗ của khối u nguyên phát."}, {"q": "Câu 6: Trong hệ thống phân loại TNM, M1 có nghĩa là gì?", "a": ["A. Không có bằng chứng về khối u", "B. Khối u đã di căn hạch vùng", "C. Khối u chưa xâm lấn", "D. Đã có di căn xa đến các cơ quan khác"], "c": 3, "e": "M0 là chưa di căn xa, M1 là đã có di căn đến các cơ quan khác ngoài hạch vùng."}, {"q": "Câu 7: Dấu hiệu nào sau đây có thể là triệu chứng lâm sàng rõ rệt của ung thư?", "a": ["A. Đau nhẹ thoáng qua", "B. Hắt hơi sổ mũi", "C. Sụt cân, hội chứng bít tắc, chèn ép", "D. Cảm giác thèm ăn liên tục"], "c": 2, "e": "Sụt cân không rõ nguyên nhân và khối u chèn ép/bít tắc các tạng là biểu hiện điển hình khi bệnh đã tiến triển."}, {"q": "Câu 8: Khám lâm sàng một khối u ác tính thường thấy tính chất nào?", "a": ["A. Mềm, tròn đều, dễ di động", "B. Mật độ từ chắc đến cứng, giới hạn không rõ, di động kém", "C. Mềm nhũn, thay đổi kích thước theo chu kỳ kinh nguyệt", "D. Sưng nóng đỏ đau rõ rệt"], "c": 1, "e": "Khối u ác tính thường xâm lấn tổ chức lân cận nên dính chặt, kém di động và có mật độ cứng."}, {"q": "Câu 9: Hạch ác tính di căn ở giai đoạn trễ thường có đặc điểm gì?", "a": ["A. Hạch rất mềm và nhỏ dần", "B. Di động tốt và không bao giờ đau", "C. Hạch bội nhiễm, vỡ vỏ bao dính cứng vào nhau và mô lân cận", "D. Chỉ xuất hiện duy nhất một hạch nhỏ"], "c": 2, "e": "Khi hạch bị ung thư di căn muộn, chúng sẽ phá vỡ vỏ bao, dính thành chùm cứng và cố định vào mô xung quanh."}, {"q": "Câu 10: Phương pháp chẩn đoán hình ảnh nào thường dùng để phát hiện dấu hiệu vi vôi hóa ở tuyến vú?", "a": ["A. Siêu âm bụng", "B. Chụp X-quang tuyến vú", "C. Chụp cộng hưởng từ (MRI) não", "D. Chụp xạ hình xương"], "c": 1, "e": "X-quang tuyến vú (Nhũ ảnh) rất nhạy trong việc phát hiện các nốt vi vôi hóa - dấu hiệu sớm của ung thư vú."}, {"q": "Câu 11: Nội soi thường được ứng dụng để chẩn đoán ung thư ở các cơ quan nào?", "a": ["A. Não, tủy sống", "B. Xương, khớp", "C. Dạ dày, đại trực tràng, thanh quản", "D. Tuyến tiền liệt, tuyến giáp"], "c": 2, "e": "Nội soi là công cụ hữu hiệu nhất để quan sát các tạng rỗng có ống như tiêu hóa và hô hấp trên."}, {"q": "Câu 12: Tumor makers (chất chỉ điểm khối u) là gì?", "a": ["A. Là thiết bị y tế dùng để đo kích thước u", "B. Là những chất tìm thấy trong mô, máu, dịch cơ thể cho thấy sự hiện diện của ung thư", "C. Là thuốc điều trị tiêu diệt khối u", "D. Là phương pháp nội soi sinh thiết u"], "c": 1, "e": "Các chất này do tế bào ung thư hoặc cơ thể phản ứng với ung thư tiết ra, giúp hỗ trợ chẩn đoán và theo dõi."}, {"q": "Câu 13: Phương pháp chẩn đoán tế bào học nào thường được dùng để tầm soát ung thư cổ tử cung?", "a": ["A. Chọc hút tế bào bằng kim nhỏ (FNA)", "B. Sinh thiết lõi", "C. Cắt lạnh", "D. Papsmear"], "c": 3, "e": "Pap smear (phết tế bào cổ tử cung) là xét nghiệm tế bào học kinh điển để sàng lọc sớm ung thư cổ tử cung."}, {"q": "Câu 14: Siêu âm có ưu điểm gì trong chẩn đoán ung thư?", "a": ["A. Chi phí thấp, không độc hại", "B. Đánh giá chính xác 100% bản chất ác tính của u", "C. Hình ảnh rõ nét nhất đối với tạng có khí (như phổi)", "D. Phát hiện sớm đột biến gen"], "c": 0, "e": "Siêu âm sử dụng sóng âm nên an toàn (không nhiễm xạ tia X), phổ biến và chi phí thấp."}, {"q": "Câu 15: Trong phân loại TNM, \"Tis\" (Carcinoma in situ) chỉ tình trạng nào?", "a": ["A. Ung thư đã di căn toàn thân", "B. Ung thư biểu mô tại chỗ (chưa xâm lấn sang tổ chức lân cận)", "C. Khối u kích thước khổng lồ", "D. Khối u không thể đánh giá được"], "c": 1, "e": "'Tis' chỉ ung thư còn nằm trên lớp màng đáy, chưa có khả năng di căn (ung thư tại chỗ)."}, {"q": "Câu 16: Hội chứng cận ung thư xảy ra do nguyên nhân chính nào?", "a": ["A. Khối u chèn ép cơ học vào rễ thần kinh", "B. Sự di căn của khối u đến gan và não", "C. Khối u tiết hormone, cytokine hoặc cơ chế tự miễn dịch", "D. Nhiễm trùng thứ phát tại khối u"], "c": 2, "e": "Khối u bài tiết các chất hoạt tính sinh học gây ra các triệu chứng toàn thân dù chưa di căn."}, {"q": "Câu 17: Ung thư phổi loại tế bào nhỏ tiết ra ADH có thể gây ra hội chứng nào sau đây?", "a": ["A. Phì đại đầu chi", "B. Hội chứng Schwartz - Bartter (phù, nhiễm độc da)", "C. Vú to ở nam giới", "D. Hội chứng Cushing"], "c": 1, "e": "Tiết ADH không thích hợp gây ứ nước, hạ natri máu, tạo ra hội chứng Schwartz-Bartter."}, {"q": "Câu 18: Hội chứng B (sốt kéo dài không rõ nguyên nhân) thường gặp trong bệnh lý ung thư nào?", "a": ["A. Ung thư cổ tử cung", "B. Ung thư dạ dày", "C. Bệnh Hodgkin, u lymphô ác tính", "D. Ung thư tuyến tiền liệt"], "c": 2, "e": "Hội chứng B (sốt, đổ mồ hôi đêm, sụt cân) là triệu chứng điển hình của các bệnh lý u lympho."}, {"q": "Câu 19: Đặc điểm nào sau đây là NHƯỢC ĐIỂM của phương pháp siêu âm?", "a": ["A. Có nguy cơ phơi nhiễm tia phóng xạ cao", "B. Khó thực hiện đối với tạng có khí và phụ thuộc nhiều vào kinh nghiệm người đọc", "C. Chỉ đánh giá được cấu trúc bề mặt ngoài da", "D. Chi phí thực hiện rất đắt đỏ"], "c": 1, "e": "Sóng siêu âm không truyền qua được khí và xương, đồng thời tính chính xác rất phụ thuộc vào kỹ năng bác sĩ."}, {"q": "Câu 20: Kết quả siêu âm vú phân loại BI-RADS 5 có ý nghĩa lâm sàng là gì?", "a": ["A. Khối u chắc chắn lành tính", "B. Tổn thương nghi ngờ ác tính mức độ thấp", "C. Hình ảnh có đặc điểm ác tính rất rõ rệt (nguy cơ rất cao)", "D. Không có tổn thương nào được tìm thấy"], "c": 2, "e": "BI-RADS 5 chỉ định nguy cơ ác tính cao (trên 95%), cần chỉ định sinh thiết ngay lập tức."}, {"q": "Câu 21: Phương pháp chẩn đoán hình ảnh nào có ưu thế vượt trội để phát hiện những tổn thương rất nhỏ ở sâu như u não, u trung thất?", "a": ["A. Chụp X-quang phổi thường quy", "B. Siêu âm qua thành bụng", "C. Chụp cắt lớp vi tính (CT scan)", "D. Chụp mạch máu"], "c": 2, "e": "CT scan cho hình ảnh cắt lớp chi tiết, tránh được sự chồng lấp các tạng như trên X-quang thường."}, {"q": "Câu 22: Các kỹ thuật y học hạt nhân (như PET, SPECT) chẩn đoán giai đoạn bệnh chính xác hơn nhờ vào khả năng nào?", "a": ["A. Nhìn thấy rõ màu sắc thực tế của khối u", "B. Phát hiện được những tổn thương vi di căn nhờ đồng vị phóng xạ", "C. Thay thế hoàn toàn sinh thiết mô bệnh học", "D. Đo được trực tiếp áp lực mạch máu khối u"], "c": 1, "e": "PET scan dựa trên mức độ chuyển hóa tế bào cao, giúp tìm ra các hạch di căn nhỏ mà CT/MRI có thể bỏ sót."}, {"q": "Câu 23: Nguyên lý của phương pháp chụp cộng hưởng từ (MRI) phụ thuộc vào yếu tố nào?", "a": ["A. Khả năng hấp thụ tia X", "B. Tính chất dội lại của sóng âm cao tần", "C. Sự phát xạ của đồng vị phóng xạ", "D. Từ học của nhân tế bào, phụ thuộc vào độ tập trung ion hydro"], "c": 3, "e": "MRI dùng từ trường mạnh để kích thích hạt nhân nguyên tử Hydro (có nhiều trong nước và mỡ cơ thể)."}, {"q": "Câu 24: CA 15-3 và CA 27.29 là chất chỉ điểm khối u thường dùng trong theo dõi bệnh lý nào?", "a": ["A. Ung thư vú", "B. Ung thư gan", "C. Ung thư buồng trứng", "D. Ung thư tuyến giáp"], "c": 0, "e": "CA 15-3 là kháng nguyên liên quan đến ung thư vú, được dùng chủ yếu để theo dõi tiến triển và tái phát."}, {"q": "Câu 25: Theo FDA, chỉ dấu sinh học CA 19-9 được chấp thuận ứng dụng chủ yếu cho bệnh ung thư nào?", "a": ["A. Ung thư tinh hoàn", "B. Ung thư tụy", "C. Ung thư phổi", "D. Ung thư bàng quang"], "c": 1, "e": "CA 19-9 tăng cao đặc hiệu trong các bệnh lý ung thư đường tiêu hóa, đặc biệt là tuyến tụy và đường mật."}, {"q": "Câu 26: Phương pháp sinh thiết tức thì (cắt lạnh) có đặc điểm và ứng dụng chính nào?", "a": ["A. Thực hiện qua nội soi ống mềm", "B. Giúp trả lời nhanh bản chất mô học ngay trong lúc phẫu thuật", "C. Lấy bệnh phẩm nuôi cấy vi khuẩn", "D. Mất 1 tuần để có kết quả"], "c": 1, "e": "Cắt lạnh (Frozen section) cho kết quả trong 15-20 phút, giúp bác sĩ phẫu thuật quyết định cắt bỏ rộng hay bảo tồn."}, {"q": "Câu 27: Xét nghiệm đột biến gen BRCA1/2 nhằm mục đích đánh giá yếu tố nào?", "a": ["A. Đích điều trị của thuốc Sorafenib", "B. Đánh giá đáp ứng kháng thể đơn dòng kháng EGFR", "C. Nguy cơ di truyền mắc ung thư vú, buồng trứng", "D. Tiêu chuẩn chẩn đoán bạch cầu cấp"], "c": 2, "e": "Đột biến gen BRCA làm giảm khả năng sửa chữa DNA, làm tăng nguy cơ ung thư vú và buồng trứng di truyền."}, {"q": "Câu 28: Chỉ dấu sinh học PSA thường dùng để tầm soát và theo dõi bệnh lý ung thư nào ở nam giới?", "a": ["A. Ung thư đại trực tràng", "B. Ung thư tuyến tiền liệt", "C. Ung thư gan", "D. Ung thư dạ dày"], "c": 1, "e": "Prostate-Specific Antigen (PSA) do tuyến tiền liệt tiết ra, nồng độ cao cảnh báo u phì đại hoặc ung thư tiền liệt tuyến."}, {"q": "Câu 29: Khảo sát \"Western blot\" trong chẩn đoán phân tử được sử dụng để phát hiện thành phần nào?", "a": ["A. DNA", "B. Nhiễm sắc thể", "C. RNA", "D. Protein"], "c": 3, "e": "Kỹ thuật Western blot dùng kháng thể đặc hiệu để phát hiện và định lượng Protein (Southern cho DNA, Northern cho RNA)."}, {"q": "Câu 30: Chẩn đoán tế bào học có nhược điểm cơ bản nào sau đây cần lưu ý?", "a": ["A. Kỹ thuật rất phức tạp và đắt tiền", "B. Bắt buộc phải mổ hở", "C. Có tỷ lệ dương tính giả hoặc âm tính giả nhất định", "D. Phải có phòng mổ vô trùng"], "c": 2, "e": "Tế bào học chỉ lấy được các tế bào rời rạc, không thấy được cấu trúc mô toàn vẹn nên dễ bỏ sót hoặc chẩn đoán nhầm."}, {"q": "Câu 31: Một bệnh nhân được chẩn đoán ung thư đại trực tràng. Việc xét nghiệm giải trình tự gen tìm đột biến KRAS có ý nghĩa lâm sàng đặc biệt quan trọng nào?", "a": ["A. Chẩn đoán xác định chính xác nguồn gốc khối u", "B. Đánh giá khả năng đáp ứng với liệu pháp kháng thể đơn dòng (thuốc nhắm đích)", "C. Tiên lượng nguy cơ di căn xương", "D. Quyết định xem bệnh nhân có cần phẫu thuật"], "c": 1, "e": "Bệnh nhân có gen KRAS đột biến sẽ KHÔNG đáp ứng với các thuốc nhắm đích kháng EGFR (như Cetuximab)."}, {"q": "Câu 32: Ở bệnh nhân ung thư phổi, xét nghiệm đột biến gen EGFR được chỉ định nhằm mục đích nhắm đích điều trị bằng thuốc nào?", "a": ["A. Gefitinib, Erlotinib", "B. Imatinib, Dasatinib", "C. Everolimus", "D. Sorafenib"], "c": 0, "e": "Các thuốc TKI (như Gefitinib, Erlotinib) có tác dụng phong tỏa chọn lọc tế bào ung thư mang đột biến EGFR."}, {"q": "Câu 33: Để đánh giá chính xác mức độ xâm lấn của ung thư thực quản hoặc trực tràng vào tổ chức lân cận, kỹ thuật nào tối ưu nhất?", "a": ["A. Bơm thuốc cản quang chụp X-quang thường quy", "B. Siêu âm nội soi (EUS)", "C. Chọc hút tế bào bằng kim nhỏ (FNA)", "D. Chụp xạ hình xương"], "c": 1, "e": "Đầu dò siêu âm áp sát niêm mạc qua nội soi giúp quan sát rõ các lớp thành ống tiêu hóa và hạch lân cận."}, {"q": "Câu 34: Sự kết hợp các Tumor marker HE4 và CA125 (thuật toán ROMA) được FDA phê duyệt nhằm hỗ trợ chẩn đoán bệnh lý nào?", "a": ["A. Ung thư tuyến giáp", "B. Ung thư cổ tử cung", "C. Ung thư buồng trứng", "D. Ung thư nội mạc tử cung"], "c": 2, "e": "Thuật toán ROMA kết hợp HE4 và CA125 giúp phân biệt nguy cơ ung thư buồng trứng trên phụ nữ có khối u vùng chậu."}, {"q": "Câu 35: Bệnh nhân ung thư vú có đột biến gen PIK3CA dương tính. Đích điều trị mới nào có thể được xem xét?", "a": ["A. Sorafenib", "B. Imatinib", "C. Everolimus (Alpelisib)", "D. Erlotinib"], "c": 2, "e": "PIK3CA là một lộ trình tín hiệu tăng sinh; thuốc ức chế đặc hiệu nhánh này (như Alpelisib) đã được phê duyệt."}, {"q": "Câu 36: Xét nghiệm phát hiện đột biến gen BCR/ABL là tiêu chuẩn để chẩn đoán và điều trị bằng Imatinib cho bệnh lý nào?", "a": ["A. Bạch cầu mạn dòng tủy", "B. Rối loạn tăng sinh tủy (đột biến JAK2)", "C. Bạch cầu cấp (đột biến FLT3)", "D. U mô đệm đường tiêu hóa"], "c": 0, "e": "Nhiễm sắc thể Philadelphia (tạo gen dung hợp BCR/ABL) là nguyên nhân gây ra bệnh Bạch cầu mạn dòng tủy (CML)."}, {"q": "Câu 37: Dấu ấn sinh học c-Kit được FDA chấp thuận ứng dụng trong chẩn đoán và điều trị bệnh lý khối u nào?", "a": ["A. Ung thư biểu mô dạ dày", "B. U mô đệm đường tiêu hóa (GIST)", "C. Ung thư trực tràng di căn", "D. Ung thư gan nguyên phát"], "c": 1, "e": "Phần lớn các u GIST đều dương tính với thụ thể c-Kit (CD117), đáp ứng tốt với thuốc ức chế Imatinib."}, {"q": "Câu 38: Cơ chế bệnh sinh của \"Hội chứng cận ung thư\" thường liên quan đến yếu tố nào?", "a": ["A. Khối u xâm lấn trực tiếp làm tổn thương thần kinh trung ương", "B. Phản ứng chéo miễn dịch giữa kháng thể chống khối u và mô bình thường", "C. Sự tắc nghẽn mạch máu do hạch", "D. Hoại tử khối u diện rộng gây sốc"], "c": 1, "e": "Hệ miễn dịch sinh kháng thể diệt khối u nhưng vô tình các kháng thể này lại tấn công các mô thần kinh, cơ lành lặn."}, {"q": "Câu 39: Đột biến gen BRAF thường được tìm thấy và là đích điều trị bằng thuốc Sorafenib/Vemurafenib trong bệnh lý ác tính nào?", "a": ["A. Melanomas (ung thư hắc tố), ung thư tuyến giáp", "B. Ung thư phổi tế bào nhỏ", "C. U lymphô không Hodgkin", "D. Ung thư tụy nội tiết"], "c": 0, "e": "Đột biến BRAF V600E gặp rất nhiều trong ung thư hắc tố da (Melanoma) và một số loại ung thư tuyến giáp thể nhú."}, {"q": "Câu 40: Chụp xạ hình đồ bằng Đồng vị phóng xạ Iod 131 chủ yếu được ứng dụng để làm gì?", "a": ["A. Đánh giá sự xâm lấn của u xơ tuyến vú", "B. Phát hiện sớm ung thư phế quản", "C. Giúp chẩn đoán ung thư giáp trạng và các tổn thương di căn có bắt Iod", "D. Tiêu diệt triệt để các khối u hạch cổ"], "c": 2, "e": "Tuyến giáp (và tế bào ung thư của nó) có đặc tính bắt giữ Iod độc quyền, giúp hình ảnh xạ hình hiện rõ tổn thương."}, {"q": "Câu 41: Bốn phương pháp chính trong điều trị ung thư hiện nay bao gồm?", "a": ["A. Phẫu thuật, Xạ trị, Hoá trị, Vật lý trị liệu", "B. Phẫu thuật, Xạ trị, Liệu pháp toàn thân, Chăm sóc giảm nhẹ", "C. Phẫu thuật, Thuốc nam, Hoá trị, Miễn dịch", "D. Nội soi, Xạ trị, Nội tiết, Thuốc nhắm đích"], "c": 1, "e": "Đây là 4 trụ cột chính đảm bảo từ chữa trị khỏi cho đến nâng cao chất lượng cuộc sống cho bệnh nhân."}, {"q": "Câu 42: Triết lý hiện đại trong điều trị toàn diện bệnh ung thư là gì?", "a": ["A. Treat the Disease, Not the Patient", "B. Chữa khỏi bằng mọi giá bất chấp chất lượng sống", "C. Treat the Patient, Not the Disease", "D. Phẫu thuật càng tàn phá rộng càng tốt"], "c": 2, "e": "Triết lý này nhấn mạnh y học lấy người bệnh làm trung tâm, không chỉ loại bỏ khối u mà phải bảo tồn chức năng."}, {"q": "Câu 43: Việc khám phá ra phương pháp nào vào năm 1846 (bởi Morton) đã tạo nên bước ngoặt cách mạng cho phẫu thuật?", "a": ["A. Vô trùng (Antisepsis)", "B. Gây mê (Anaesthesia)", "C. Tia X", "D. Kháng sinh"], "c": 1, "e": "Gây mê bằng Ether của Morton giúp bác sĩ có đủ thời gian phẫu thuật loại bỏ khối u mà bệnh nhân không đau đớn."}, {"q": "Câu 44: Xạ trị là phương pháp điều trị ung thư sử dụng loại tia nào?", "a": ["A. Tia hồng ngoại", "B. Tia tử ngoại (UV)", "C. Bức xạ ion hóa", "D. Sóng siêu âm"], "c": 2, "e": "Bức xạ ion hóa (có năng lượng cực cao) có khả năng đập vỡ cấu trúc DNA, tiêu diệt tế bào đang nhân chia."}, {"q": "Câu 45: Bản chất của tia X và tia Gamma sử dụng trong xạ trị là gì?", "a": ["A. Bức xạ dạng hạt điện tử", "B. Dạng sóng điện từ", "C. Chùm proton", "D. Chùm tia neutron"], "c": 1, "e": "Tia X và tia Gamma đều là sóng điện từ (không có khối lượng) nhưng có bước sóng cực ngắn và đâm xuyên mạnh."}, {"q": "Câu 46: Thuốc kháng thể đơn dòng (Liệu pháp nhắm đích) thường có đuôi tên gọi là gì?", "a": ["A. -nib", "B. -mab", "C. -tin", "D. -cin"], "c": 1, "e": "Hậu tố \"mab\" viết tắt của \"Monoclonal Antibody\" (Kháng thể đơn dòng), ví dụ: Trastuzumab, Bevacizumab."}, {"q": "Câu 47: Thuốc phân tử nhỏ ức chế trong màng tế bào thường có đuôi tên gọi là gì?", "a": ["A. -nib", "B. -mab", "C. -lol", "D. -pril"], "c": 0, "e": "Hậu tố \"nib\" dùng cho các thuốc ức chế enzyme kinase (kinase inhibitors), ví dụ: Imatinib, Sorafenib."}, {"q": "Câu 48: Xạ trị áp sát (Brachytherapy) có nghĩa là gì?", "a": ["A. Đưa nguồn phóng xạ lại gần hoặc vào trong lòng khối u", "B. Chiếu tia phóng xạ từ ngoài cơ thể qua da", "C. Uống đồng vị phóng xạ", "D. Chiếu xạ toàn thân"], "c": 0, "e": "Nguồn phóng xạ được đặt trực tiếp vào khối u (vd: cổ tử cung) giúp tập trung liều diệt u tối đa, tránh hại mô lành."}, {"q": "Câu 49: Phương pháp xạ trị chuyển hóa thường dùng Iod 131 để điều trị loại ung thư nào?", "a": ["A. Ung thư vú", "B. Ung thư tuyến tiền liệt", "C. Ung thư tuyến giáp loại biệt hóa tốt", "D. Ung thư gan"], "c": 2, "e": "Tế bào ung thư tuyến giáp biệt hóa giữ được khả năng bắt Iod, từ đó bị phóng xạ Iod-131 tiêu diệt từ bên trong."}, {"q": "Câu 50: Tài liệu nào được xem là quan trọng nhất trong hồ sơ phẫu thuật ung thư của bệnh nhân?", "a": ["A. Phiếu thu viện phí", "B. Giấy cam đoan mổ", "C. Bản tường trình về phẫu thuật", "D. Kết quả siêu âm trước mổ"], "c": 2, "e": "Tường trình phẫu thuật ghi rõ vị trí, mức độ xâm lấn u và các hạch đã vét, là cơ sở để lập kế hoạch điều trị sau mổ."}, {"q": "Câu 51: Trong chu kỳ tế bào, mô sẽ đặc biệt nhạy cảm với tia xạ nhất ở giai đoạn nào?", "a": ["A. Pha G0 (nghỉ ngơi)", "B. Pha G1", "C. Pha S (tổng hợp DNA)", "D. Pha M (phân bào) và G2"], "c": 3, "e": "Tế bào chuẩn bị và đang thực hiện quá trình phân chia NST (G2/M) dễ bị tổn thương vỡ nát DNA nhất bởi tia xạ."}, {"q": "Câu 52: Hóa trị triệu chứng có mục đích chính là gì?", "a": ["A. Tiêu diệt hoàn toàn khối u", "B. Dùng cho bệnh nhân giai đoạn cuối để giảm nhẹ triệu chứng", "C. Phòng ngừa ung thư di truyền", "D. Thay thế hoàn toàn phẫu thuật"], "c": 1, "e": "Mục đích là làm khối u teo bớt để giảm đau, giảm chèn ép, giúp bệnh nhân giai đoạn muộn sống thoải mái hơn."}, {"q": "Câu 53: Yếu tố oxy ảnh hưởng như thế nào đến hiệu quả của xạ trị?", "a": ["A. Mô thiếu oxy sẽ nhạy xạ hơn", "B. Mô thiếu máu nuôi, hoại tử ít nhạy xạ hơn", "C. Nồng độ oxy không ảnh hưởng", "D. Tế bào bướu luôn có oxy rất cao"], "c": 1, "e": "Oxy đóng vai trò cố định các đứt gãy DNA do tia xạ gây ra. Khối u hoại tử, thiếu máu nuôi sẽ \"lì\" (kháng) xạ trị."}, {"q": "Câu 54: Liệu pháp miễn dịch trong ung thư hoạt động dựa trên cơ chế cơ bản nào?", "a": ["A. Gây độc trực tiếp tế bào", "B. Kích hoạt hệ thống miễn dịch chống lại khối u", "C. Thay đổi gene di truyền", "D. Cắt đứt mạch máu khối u"], "c": 1, "e": "Thuốc miễn dịch dỡ bỏ rào cản do khối u tạo ra, giúp tế bào bạch cầu T nhận diện và tấn công khối u."}, {"q": "Câu 55: Biến chứng cấp tính của xạ trị trên mô lành thường có biểu hiện giống với tình trạng nào?", "a": ["A. Viêm", "B. Xơ hóa vĩnh viễn", "C. Đột biến gen lặn", "D. Suy tim mãn tính"], "c": 0, "e": "Tia xạ gây hủy hoại biểu mô, tạo phản ứng viêm cấp tính như viêm da, viêm niêm mạc (đỏ, rát, loét) tại vùng chiếu."}, {"q": "Câu 56: Việc chẩn đoán ung thư trước khi điều trị cần trải qua 3 bước căn bản nào?", "a": ["A. Siêu âm, X-quang, MRI", "B. Chẩn đoán u nguyên phát, Giải phẫu bệnh, Giai đoạn bệnh", "C. Khám lâm sàng, Xét nghiệm máu, Mổ thám sát", "D. Nội soi, Xạ hình xương, Sinh thiết lạnh"], "c": 1, "e": "Đây là 3 chân kiềng cốt lõi: Xác định khối u ở đâu, bản chất tế bào là gì, và nó đã lan đến đâu (TNM)."}, {"q": "Câu 57: Hóa trị tân bổ trợ (Neoadjuvant chemotherapy) được định nghĩa là gì?", "a": ["A. Hóa trị liều thấp kéo dài", "B. Hóa trị sử dụng TRƯỚC phẫu thuật nhằm làm giảm kích thước khối u", "C. Hóa trị dùng điều trị di căn xa", "D. Hóa trị dùng SAU phẫu thuật"], "c": 1, "e": "Tân bổ trợ giúp làm teo nhỏ khối u, biến từ chỗ không thể mổ thành mổ được, hoặc giúp phẫu thuật bảo tồn cơ quan."}, {"q": "Câu 58: Thuốc hóa trị nhóm kháng sinh (như Doxorubicin) nổi tiếng với độc tính đặc trưng trên cơ quan nào?", "a": ["A. Gan", "B. Suy thận cấp", "C. Suy tim, rối loạn nhịp tim (muộn)", "D. Viêm màng não"], "c": 2, "e": "Doxorubicin (Anthracycline) gây tích lũy độc tính cơ tim, có thể dẫn đến suy tim không hồi phục nếu vượt liều giới hạn."}, {"q": "Câu 59: Thuốc Anastrozole, Letrozole thuộc nhóm thuốc nào trong liệu pháp nội tiết?", "a": ["A. Thuốc điều hòa thụ thể Estrogen chọn lọc (SERM)", "B. Thuốc ức chế Aromatase (Aromatase inhibitor)", "C. Kháng Androgen", "D. Chất tương tự Somatostatin"], "c": 1, "e": "Chúng ức chế men Aromatase chuyển hóa androgen thành estrogen ở mô mỡ, chuyên dùng cho phụ nữ đã mãn kinh."}, {"q": "Câu 60: Theo RECIST 1.1, \"CR\" (Complete Response) có nghĩa là gì?", "a": ["A. Giảm $\\ge30\\%$ tổng đường kính", "B. Khối u giữ nguyên", "C. Biến mất tất cả các tổn thương và hạch bạch huyết bệnh lý", "D. Xuất hiện u mới"], "c": 2, "e": "CR là đáp ứng hoàn toàn, không còn phát hiện bất kỳ tổn thương ung thư nào qua các chẩn đoán hình ảnh."}, {"q": "Câu 61: Cơ chế tác dụng chính của thuốc Tamoxifen trong điều trị ung thư vú là gì?", "a": ["A. Ức chế thụ thể EGFR", "B. Điều hòa thụ thể estrogen chọn lọc (SERM)", "C. Tiêu diệt trực tiếp tế bào bướu", "D. Ngăn cản hình thành thoi nhiễm sắc"], "c": 1, "e": "Tamoxifen tranh chấp gắn vào thụ thể Estrogen ở mô vú, không cho hormone này kích thích khối u phát triển."}, {"q": "Câu 62: Tại sao trong xạ trị, người ta thường phân nhỏ tổng liều thành nhiều phân liều rải đều (Fractionation)?", "a": ["A. Giảm chi phí điều trị", "B. Để mô lành có thời gian sửa chữa và mô bướu tái cung cấp oxy nhạy xạ hơn", "C. Để máy xạ trị không quá tải", "D. Vì tia phân liều lớn không xuyên qua da"], "c": 1, "e": "Tế bào lành có khả năng phục hồi sau xạ tốt hơn tế bào u. Phân nhỏ liều lợi dụng thời gian nghỉ giữa các đợt để mô lành hồi phục."}, {"q": "Câu 63: Nhóm mô lành/mô bướu nào sau đây có khả năng sửa chữa MẠNH và do đó ÍT nhạy cảm với xạ trị?", "a": ["A. Mô sinh dục, mô thận", "B. Hệ tạo huyết, tế bào tủy xương", "C. Lymphoma, Seminoma", "D. Mô thần kinh, cơ, Melanoma (ung thư hắc tố)"], "c": 3, "e": "Mô biệt hóa cao ít phân chia (thần kinh, cơ xương) và ung thư hắc tố rất kháng xạ trị."}, {"q": "Câu 64: Cơ chế tác dụng của thuốc chống chuyển hóa 5-Fluorouracil (5-FU) là gì?", "a": ["A. Có cấu trúc giống acid folic", "B. Kháng pyrimidin, làm rối loạn quá trình tổng hợp DNA, RNA", "C. Gây kết dính vi quản", "D. Phá vỡ chuỗi kép DNA trực tiếp"], "c": 1, "e": "5-FU giả dạng uracil (một pyrimidine), khi tích hợp vào cấu trúc DNA/RNA của khối u sẽ gây lỗi phiên mã."}, {"q": "Câu 65: Nhóm Alkaloid (như Vincristin) và Taxan có cơ chế ức chế phân chia tế bào bằng cách nào?", "a": ["A. Cạnh tranh nguyên liệu DNA", "B. Gắn gốc alkyl vào DNA", "C. Gây kết dính vi quản, ngăn cản hình thành thoi phân bào", "D. Ức chế enzyme topoisomerase"], "c": 2, "e": "Các thuốc này làm đóng băng các ống vi quản, khiến bộ nhiễm sắc thể không thể bị kéo về hai cực của tế bào."}, {"q": "Câu 66: Trong phẫu thuật tạo hình sau cắt tuyến vú, phẫu thuật viên thường sử dụng vạt cơ nào?", "a": ["A. Vạt LD (cơ lưng rộng) hoặc vạt TRAM (cơ thẳng bụng)", "B. Vạt cơ mông lớn", "C. Vạt cơ đùi thẳng", "D. Vạt da vùng cổ"], "c": 0, "e": "Vạt cơ lưng rộng (Latissimus Dorsi) và vạt cơ thẳng bụng lấy mỡ/cơ dưới bụng kéo lên tạo hình bầu vú rất thẩm mỹ."}, {"q": "Câu 67: Phẫu thuật \"Second look\" (đánh giá tiến triển) mang ý nghĩa gì?", "a": ["A. Lấy đi khối u tái phát", "B. Phẫu thuật kiểm tra lại tình trạng ổ bụng sau đợt điều trị hóa chất/xạ trị", "C. Phẫu thuật thẩm mỹ vết sẹo", "D. Phẫu thuật cầm máu"], "c": 1, "e": "Thường dùng trong ung thư buồng trứng để mở bụng xem hóa trị có làm sạch các tổn thương gieo rắc hay chưa."}, {"q": "Câu 68: Trong bảng tiêu chuẩn CTCAE v5.0, Độc tính Độ 4 (Grade 4) được mô tả thế nào?", "a": ["A. Nhẹ, không cần can thiệp", "B. Vừa phải, can thiệp tối thiểu", "C. Nặng, cần nhập viện", "D. Đe dọa tính mạng, cần can thiệp khẩn cấp"], "c": 3, "e": "Grade 4 là tình trạng độc tính cực kỳ nghiêm trọng, suy tạng, đe dọa sinh mạng bệnh nhân (như sốc hạ bạch cầu)."}, {"q": "Câu 69: Xạ-phẫu (Gamma-knife) là kỹ thuật điều trị có nguyên lý như thế nào?", "a": ["A. Vừa mổ dao điện vừa chiếu tia X", "B. Ứng dụng bức xạ ion hóa liều cao tập trung để loại bỏ khối bướu giống như phẫu thuật lấy đi", "C. Đưa nguồn phóng xạ vào ổ bụng", "D. Dùng dao mổ tẩm phóng xạ"], "c": 1, "e": "Hội tụ hàng trăm chùm tia Gamma vào một điểm duy nhất (u não) giúp đốt cháy u chỉ trong 1 lần chiếu."}, {"q": "Câu 70: Tác dụng phụ thường gặp nhất của hầu hết các thuốc hóa trị trên tủy xương là gì?", "a": ["A. Tăng sinh hồng cầu đa to", "B. Viêm tủy xương do vi khuẩn", "C. Giảm bạch cầu, hồng cầu, tiểu cầu", "D. Ung thư máu thứ phát"], "c": 2, "e": "Hóa chất tấn công các tế bào sinh trưởng nhanh như tế bào gốc tủy xương, gây suy tủy (giảm 3 dòng máu)."}, {"q": "Câu 71: Nhóm thuốc hóa trị Alkyl hóa (Alkylating agents) có tính chất đặc trưng nào đối với chu kỳ tế bào?", "a": ["A. Chỉ tiêu diệt tế bào pha M", "B. Tiêu diệt tế bào không phụ thuộc vào pha của chu kỳ tế bào (Cell cycle-nonspecific)", "C. Chỉ có tác dụng trên pha G0", "D. Chỉ tiêu diệt tế bào pha S"], "c": 1, "e": "Các chất alkyl hóa (như Cyclophosphamide) gắn gốc alkyl trực tiếp phá hủy DNA bất kể tế bào đang ở pha nào."}, {"q": "Câu 72: Cơ chế của các kháng thể đơn dòng ức chế chốt kiểm soát miễn dịch (như Anti-PD-1) là gì?", "a": ["A. Kích thích apoptosis tế bào bướu", "B. Ngăn chặn sự né tránh miễn dịch của khối u, tái kích hoạt tế bào T để tiêu diệt khối u", "C. Bất hoạt enzyme tiêu hóa của u", "D. Tạo màng bảo vệ khối u"], "c": 1, "e": "Tế bào ung thư dùng protein PD-L1 như \"mặt nạ tàng hình\". Anti-PD-1 tháo mặt nạ này, giúp bạch cầu T nhận diện khối u."}, {"q": "Câu 73: Theo RECIST 1.1, Progressive Disease (PD - Bệnh tiến triển) được xác định khi nào?", "a": ["A. Tăng $\\ge20\\%$ tổng các đường kính tổn thương, hoặc xuất hiện tổn thương mới", "B. Tăng $10\\%$ kích thước", "C. Bệnh nhân đau nhiều hơn", "D. Tumor marker gấp đôi"], "c": 0, "e": "Khối u to lên từ 20% trở lên (tăng tuyệt đối $>5mm$) hoặc có thêm di căn mới nghĩa là phác đồ đang dùng bị kháng."}, {"q": "Câu 74: Sự khác biệt giữa Hóa trị củng cố và Hóa trị duy trì là gì?", "a": ["A. Củng cố dùng trước mổ, duy trì sau mổ", "B. Củng cố nhằm giữ thành quả lui bệnh sau khi tấn công; duy trì dùng liều thấp hơn để kéo dài thời gian lui bệnh", "C. Củng cố dùng u đặc, duy trì ung thư máu", "D. Củng cố tiêm, duy trì uống"], "c": 1, "e": "Sau khi \"đánh\" mạnh bằng hóa trị tấn công, Củng cố giúp làm sạch triệt để, Duy trì dùng thuốc nhẹ nhàng để ngừa tái phát."}, {"q": "Câu 75: Thuốc chống ung thư Methotrexate phát huy tác dụng thông qua cơ chế nào?", "a": ["A. Gắn chéo chuỗi DNA", "B. Có cấu trúc giống acid folic, ức chế cạnh tranh enzyme dihydrofolate reductase", "C. Tạo gốc tự do vỡ màng", "D. Tác động thụ thể HER2"], "c": 1, "e": "Methotrexate chặn đường tổng hợp acid folic, cắt đứt nguồn nguyên liệu cần thiết để tạo nucleotide cho DNA."}, {"q": "Câu 76: Trong điều trị nội tiết ung thư tuyến tiền liệt, Abiraterone acetate thuộc phân nhóm nào?", "a": ["A. Antiandrogen", "B. GnRH antagonist", "C. Đồng vận LHRH", "D. Cytochrome P450 17 alpha inhibitor (Ức chế men CYP17)"], "c": 3, "e": "Abiraterone ức chế enzyme CYP17, khóa hoàn toàn nguồn sản xuất testosterone từ tinh hoàn, tuyến thượng thận và cả bản thân khối u."}, {"q": "Câu 77: Lý do chính cho việc phối hợp đa hóa trị liệu trong ung thư là gì?", "a": ["A. Giảm bớt độc tính trên 1 cơ quan", "B. Phối hợp các cơ chế tác dụng khác nhau để tăng hiệu quả và tránh kháng thuốc", "C. Rút ngắn thời gian điều trị", "D. Tiết kiệm chi phí"], "c": 1, "e": "Mỗi loại thuốc diệt một số dòng tế bào khác nhau. Phối hợp giúp tiêu diệt triệt để u đa dòng và hạn chế kháng thuốc."}, {"q": "Câu 78: Nguyên tắc tiên quyết trước khi thực hiện các phẫu thuật ung thư triệt căn tàn phá là gì?", "a": ["A. Phải có kết quả chẩn đoán giải phẫu bệnh ác tính", "B. Phải xạ trị trước mổ", "C. Thực hiện nội soi ổ bụng", "D. Truyền ít nhất 1 đợt hóa chất"], "c": 0, "e": "Phẫu thuật triệt căn (cắt cụt chi, cắt bỏ trực tràng mang hậu môn nhân tạo) để lại di chứng tàn phế, bắt buộc phải có bằng chứng ung thư chắc chắn."}, {"q": "Câu 79: Phẫu thuật sinh thiết hạch gác (Sentinel lymph node biopsy) mang lại lợi ích lâm sàng lớn nhất nào?", "a": ["A. Loại bỏ 100% hạch di căn", "B. Giúp đánh giá di căn hạch chính xác để tránh vét hạch nách rộng rãi không cần thiết, giảm phù tay", "C. Kéo dài sống thêm gấp đôi", "D. Thay thế xạ trị"], "c": 1, "e": "Thay vì nạo toàn bộ hạch nách gây biến chứng tay voi, bác sĩ chỉ tìm hạch đầu tiên để xét nghiệm. Nếu hạch này âm tính, không cần vét tiếp."}, {"q": "Câu 80: Cột mốc nào đánh dấu sự bùng nổ phẫu thuật xâm lấn tối thiểu (Laparoscopy) cuối thập niên 1980?", "a": ["A. Semm cắt ruột thừa nội soi", "B. Ứng dụng robot da Vinci", "C. Mouret công bố mô tả phẫu thuật cắt túi mật nội soi", "D. Morton phát minh thuốc mê"], "c": 2, "e": "Ca cắt túi mật nội soi thành công của Philippe Mouret năm 1987 đã mở ra cuộc cách mạng mổ nội soi toàn cầu."}, {"q": "Câu 81: Chu kỳ tế bào bình thường bao gồm các pha chính nào theo thứ tự?", "a": ["A. G1, S, G2, M", "B. G0, S, M, G1", "C. M, S, G0, G2", "D. S, M, G1, G2"], "c": 0, "e": "Tế bào trưởng thành (G1), tổng hợp DNA (S), kiểm tra (G2) và tiến hành phân bào (Mitosis)."}, {"q": "Câu 82: Apoptosis trong sinh học tế bào được hiểu là gì?", "a": ["A. Sự phân chia tế bào chất", "B. Chết tế bào theo chương trình", "C. Quá trình nhân đôi DNA", "D. Hiện tượng tế bào sinh trưởng vô hạn"], "c": 1, "e": "Đây là cơ chế tự hủy diệt của tế bào già yếu hoặc bị lỗi gen, giúp bảo vệ cơ thể khỏi ung thư."}, {"q": "Câu 83: Trong khói thuốc lá có khoảng bao nhiêu chất hóa học được xếp vào loại gây ung thư?", "a": ["A. Khoảng 10 chất", "B. Khoảng 40 chất (hiện tại WHO ước tính hơn 60-70 chất)", "C. Khoảng 100 chất", "D. Khoảng 400 chất"], "c": 1, "e": "Khói thuốc chứa hơn 7000 chất, trong đó có khoảng 40-70 chất gây ung thư đã được chứng minh (như Benzen, Naphthylamine)."}, {"q": "Câu 84: Gen p53 đóng vai trò gì trong sự phát triển của khối u?", "a": ["A. Là gen sinh ung thư (Oncogene)", "B. Là gen ức chế khối u (Tumor suppressor gene)", "C. Là gen quy định màu da", "D. Là gen hỗ trợ nhân đôi virus"], "c": 1, "e": "p53 được gọi là \"vệ sĩ của hệ gen\", nó ngăn chặn tế bào phân chia nếu phát hiện DNA bị hỏng."}, {"q": "Câu 85: Asbestos (A-mi-ăng) ở nhà máy đóng tàu liên quan đến việc làm tăng tỷ lệ mắc ung thư nào?", "a": ["A. Ung thư bàng quang", "B. Ung thư gan", "C. Ung thư phổi và U trung biểu mô", "D. Ung thư dạ dày"], "c": 2, "e": "Sợi Amiăng cực nhỏ khi hít vào phổi sẽ ghim vào màng phổi, lâu ngày gây U trung biểu mô ác tính."}, {"q": "Câu 86: Bức xạ tia cực tím (UV) từ mặt trời là nguyên nhân chính gây ra ung thư nào?", "a": ["A. Ung thư máu", "B. Ung thư da", "C. Ung thư vú", "D. Ung thư xương"], "c": 1, "e": "Tia UV xuyên qua da gây đứt gãy DNA màng đáy, hình thành ung thư tế bào đáy, tế bào gai và hắc tố da."}, {"q": "Câu 87: Người có màu da nào dễ mắc ung thư da hơn do thiếu tác dụng bảo vệ của Melanin?", "a": ["A. Da đen", "B. Da vàng", "C. Da trắng", "D. Da nâu"], "c": 2, "e": "Da trắng có rất ít hắc tố Melanin (chất chống nắng tự nhiên), nên tế bào da dễ bị UV làm tổn thương."}, {"q": "Câu 88: Virus nào sau đây có mối liên quan mật thiết và là nguyên nhân chính gây ung thư cổ tử cung?", "a": ["A. HBV", "B. HCV", "C. HPV", "D. EBV"], "c": 2, "e": "Human Papillomavirus (đặc biệt tuýp 16, 18) là tác nhân gây ra hơn 95% ca ung thư cổ tử cung."}, {"q": "Câu 89: Vi khuẩn Helicobacter Pylori (HP) gây ra bệnh ung thư ở cơ quan nào?", "a": ["A. Thực quản", "B. Đại trực tràng", "C. Dạ dày", "D. Bàng quang"], "c": 2, "e": "Vi khuẩn HP gây viêm loét dạ dày mạn tính, lâu dần chuyển sản ruột và loạn sản thành ung thư dạ dày."}, {"q": "Câu 90: Thảm họa bom nguyên tử tại Hiroshima đã làm tăng mạnh loại ung thư nào ở những người sống sót?", "a": ["A. Da và dạ dày", "B. Ung thư máu (Bệnh bạch cầu) và ung thư tuyến giáp", "C. Gan và tụy", "D. Cổ tử cung và vú"], "c": 1, "e": "Bức xạ ion hóa liều cao gây đột biến tủy xương sinh bệnh bạch cầu rất nhanh (trong vòng vài năm đầu)."}, {"q": "Câu 91: Nấm Aspergillus flavus trên ngũ cốc ẩm mốc tiết ra độc tố nào gây ung thư gan?", "a": ["A. Naphthylamine", "B. Benzene", "C. Aflatoxin B1", "D. Asen"], "c": 2, "e": "Aflatoxin là chất kịch độc cho gan, gây đột biến gen và là nguyên nhân hàng đầu gây HCC ở vùng nhiệt đới ẩm."}, {"q": "Câu 92: Uống nhiều rượu (nhất là kết hợp hút thuốc) gây ung thư ở vị trí nào?", "a": ["A. Đường hô hấp trên, hầu họng, thực quản, gan", "B. Não, tủy sống", "C. Tuyến tiền liệt, buồng trứng", "D. Xương, khớp"], "c": 0, "e": "Rượu và thuốc lá có tác dụng hiệp đồng làm niêm mạc khoang miệng, thực quản dễ ngấm chất độc sinh ung thư."}, {"q": "Câu 93: Chế độ ăn nhiều protein động vật và thịt đỏ làm tăng nguy cơ mắc ung thư nào?", "a": ["A. Ung thư phổi", "B. Ung thư đại trực tràng", "C. Ung thư tuyến giáp", "D. Ung thư da"], "c": 1, "e": "Thịt đỏ (bò, heo) nướng/chiên chứa nhiều chất béo và acid mật, lưu lại lâu trong đại tràng gây độc niêm mạc ruột."}, {"q": "Câu 94: Hút thuốc lá là nguyên nhân sinh ung thư thuộc nhóm tác nhân nào?", "a": ["A. Tác nhân vật lý", "B. Tác nhân sinh học", "C. Tác nhân hóa học", "D. Tác nhân cơ học"], "c": 2, "e": "Khói thuốc chứa hỗn hợp hàng nghìn hợp chất hóa học được đốt cháy và bốc hơi."}, {"q": "Câu 95: Yếu tố sinh hoạt nào làm tăng nguy cơ ung thư vú ở phụ nữ trên 40 tuổi?", "a": ["A. Tập thể dục", "B. Béo phì, ít vận động", "C. Ăn rau xanh", "D. Ngủ đủ giấc"], "c": 1, "e": "Phụ nữ mãn kinh nếu béo phì, lượng mô mỡ lớn sẽ sản xuất nhiều estrogen ngoại biên kích thích ung thư vú."}, {"q": "Câu 96: Quá trình tổng hợp và nhân đôi DNA diễn ra tại pha nào của chu kỳ tế bào?", "a": ["A. Pha G1", "B. Pha G2", "C. Pha S", "D. Pha M"], "c": 2, "e": "Pha S (Synthesis) là thời điểm NST tự nhân đôi để chuẩn bị chia cho 2 tế bào con."}, {"q": "Câu 97: Các gen nào sau đây được phân loại là gen sinh ung thư (Oncogenes)?", "a": ["A. p53, pRB", "B. Ras, Myc", "C. BRCA1, BRCA2", "D. APC, PTEN"], "c": 1, "e": "Gen Ras và Myc bình thường giúp tế bào sinh trưởng, khi bị đột biến chúng hoạt động quá mức gây ung thư."}, {"q": "Câu 98: Thuốc hóa trị nhóm alkyl hóa (như Cyclophosphamid) có nguy cơ gây ra tác dụng phụ muộn nào?", "a": ["A. Viêm dạ dày", "B. Rụng tóc vĩnh viễn", "C. Phát triển các ung thư thứ phát (Leukemia)", "D. Tiểu đường tuýp 2"], "c": 2, "e": "Hóa chất gắn trực tiếp vào DNA mô lành làm lỗi mã di truyền, 5-10 năm sau có thể phát sinh ung thư máu."}, {"q": "Câu 99: Công nhân phẩm nhuộm phơi nhiễm Naphthylamine có nguy cơ mắc ung thư cơ quan nào?", "a": ["A. Bàng quang", "B. Gan", "C. Phổi", "D. Não"], "c": 0, "e": "Chất Naphthylamine sau khi hấp thụ sẽ được bài tiết qua nước tiểu, nằm ứ đọng và gây ung thư biểu mô bàng quang."}, {"q": "Câu 100: Chất gây ung thư Polycyclic aromatic hydrocarbon (PAH) thường tìm thấy ở đâu?", "a": ["A. Thuốc trừ sâu", "B. Nhựa đường, sản phẩm đốt than đá, khói bếp", "C. Tia X", "D. Nước nhiễm Asen"], "c": 1, "e": "Khói than, bồ hóng, khói nướng thịt chứa lượng lớn PAH, nguyên nhân gây ung thư bìu kinh điển ở thợ quét ống khói xưa."}, {"q": "Câu 101: Nông dân tiếp xúc thuốc trừ sâu có gia tăng tỷ lệ mắc bệnh lý ác tính nào?", "a": ["A. Ung thư thanh quản", "B. Ung thư cổ tử cung", "C. Ung thư da (Melanoma) và các U lympho", "D. Ung thư xương"], "c": 2, "e": "Các nghiên cứu nông nghiệp (vd Agricultural Health Study) cho thấy phơi nhiễm thuốc sâu làm tăng ung thư hắc tố da."}, {"q": "Câu 102: Loại ung thư nào KHÔNG do bức xạ tia cực tím (UV)?", "a": ["A. Ung thư tế bào đáy", "B. Ung thư tế bào gai", "C. Melanoma", "D. Ung thư trung biểu mô (Mesothelioma)"], "c": 3, "e": "Mesothelioma do hít phải bụi A-mi-ăng, không liên quan đến tia nắng mặt trời."}, {"q": "Câu 103: Virus HBV và HCV là nguyên nhân hàng đầu dẫn đến bệnh lý ác tính nào?", "a": ["A. Ung thư vòm họng", "B. Ung thư gan nguyên phát", "C. Ung thư hạch", "D. Ung thư dạ dày"], "c": 1, "e": "Hai loại vi rút này phá hủy tế bào gan mạn tính, dẫn đến xơ gan và sau cùng là ung thư biểu mô tế bào gan."}, {"q": "Câu 104: Ký sinh trùng Schistosoma haematobium (Sán máng) gây ra loại ung thư nào?", "a": ["A. Gan", "B. Đường mật", "C. Bàng quang", "D. Tụy"], "c": 2, "e": "Sán máng đẻ trứng ở niêm mạc bàng quang gây viêm dị ứng mạn tính, chuyển dạng thành ung thư bàng quang."}, {"q": "Câu 105: Ký sinh trùng Clonorchis sinensis (Sán lá gan nhỏ) là yếu tố nguy cơ của bệnh nào?", "a": ["A. Ung thư gan/đường mật", "B. Đại tràng", "C. Phổi", "D. Thận"], "c": 0, "e": "Sán cư trú trong ống mật, gây viêm xơ đường mật mạn tính và phát triển thành ung thư đường mật (Cholangiocarcinoma)."}, {"q": "Câu 106: Diệt trừ vi khuẩn Helicobacter Pylori mang lại lợi ích gì?", "a": ["A. Ngăn ngừa ung thư vòm họng", "B. Giảm đáng kể tỷ lệ mắc ung thư dạ dày", "C. Chữa ung thư tụy", "D. Tiêu diệt ung thư đại tràng"], "c": 1, "e": "Tiệt trừ HP sớm sẽ ngăn chặn viêm dạ dày teo, giảm đáng kể nguy cơ xuất hiện ung thư dạ dày vùng hang vị."}, {"q": "Câu 107: Ngoài ung thư cổ tử cung, virus HPV còn liên quan mật thiết đến cơ quan nào?", "a": ["A. Phổi", "B. Gan", "C. Hầu họng, âm hộ, âm đạo, hậu môn, dương vật", "D. Tuyến giáp"], "c": 2, "e": "Virus lây qua niêm mạc vùng sinh dục và miệng, gây tổn thương sùi và ung thư tại tất cả các vùng tiếp xúc này."}, {"q": "Câu 108: Độc tố Aflatoxin B1 sinh ung thư thông qua cơ chế nào?", "a": ["A. Tạo gốc tự do phá màng", "B. Tạo các phức hợp (adducts) với DNA gây đột biến gen", "C. Kìm hãm nguyên phân", "D. Gây phản ứng dị ứng"], "c": 1, "e": "Aflatoxin khi vào gan tạo thành dạng epoxide bám chặt vào phân tử Guanine của DNA, làm sai lệch mã di truyền."}, {"q": "Câu 109: Công nhân khai thác mỏ Niken có nguy cơ cao mắc ung thư nào?", "a": ["A. Bàng quang", "B. Tiền liệt tuyến", "C. Ung thư mũi xoang và phổi", "D. Hắc tố da"], "c": 2, "e": "Bụi Niken hít vào đọng lại ở niêm mạc đường hô hấp trên và dưới, sinh ung thư tại chỗ (mũi xoang, phế quản)."}, {"q": "Câu 110: Những tổn thương do tia bức xạ gây ra trên phân tử DNA có đặc điểm gì?", "a": ["A. Luôn được sửa hoàn hảo", "B. Chỉ xảy ra pha G0", "C. Nếu quá trình tự sửa chữa sai sót sẽ dẫn đến đột biến gen và ung thư hóa", "D. Không ảnh hưởng tế bào sống"], "c": 2, "e": "Tia xạ bẻ gãy DNA, tế bào cố gắng nối lại nhưng nối sai lệch, tạo ra cấu trúc DNA biến dị sống sót và nhân lên."}, {"q": "Câu 111: Trong ung thư gan do phơi nhiễm Aflatoxin B1, dạng đột biến gen đặc hiệu nào thường được tìm thấy?", "a": ["A. Đột biến BRCA1", "B. Đột biến gen Tp53 (đặc biệt là R249S)", "C. Đột biến EGFR", "D. Đột biến APC"], "c": 1, "e": "Aflatoxin B1 \"thích\" tấn công vào Codon 249 của gen p53, một chỉ điểm phân tử đặc hiệu vùng dịch tễ."}, {"q": "Câu 112: Theo Globocan 2018, tác nhân nhiễm trùng (infectious agent) nào gây ra nhiều ca ung thư nhất trên toàn cầu?", "a": ["A. Virus HPV", "B. Virus HBV", "C. Vi khuẩn Helicobacter Pylori", "D. Virus HCV"], "c": 2, "e": "Vi khuẩn HP cực kỳ phổ biến (hơn nửa dân số thế giới nhiễm), là nguyên nhân số lượng ca ung thư dạ dày khổng lồ."}, {"q": "Câu 113: Các nghiên cứu chỉ ra ung thư hắc tố da ở nông dân có liên hệ với loại thuốc trừ sâu nào?", "a": ["A. Penicillin", "B. Maneb/mancozeb, parathion và carbaryl", "C. Thuốc diệt cỏ Dioxin", "D. Paraquat"], "c": 1, "e": "Nghiên cứu AHS xác định sự phơi nhiễm các hóa chất bảo vệ thực vật đặc thù này có mối tương quan mạnh."}, {"q": "Câu 114: Sự kiện bức xạ ion hóa liều thấp thường dẫn đến ung thư thứ phát dạng nào và thời gian ủ bệnh bao lâu?", "a": ["A. Sarcoma mềm, 1 năm", "B. Ung thư biểu mô (Carcinomas) hoặc bạch cầu, ủ bệnh từ 5 đến 10 năm", "C. Hắc tố da, ngay lập tức", "D. U thần kinh đệm, 6 tháng"], "c": 1, "e": "Ung thư thứ phát do tia xạ không xuất hiện ngay mà cần hàng năm trời tích lũy đột biến (thường 5-10 năm cho ung thư máu)."}, {"q": "Câu 115: Cơ chế sinh ung thư của các gen ức chế khối u (Tumor suppressors) bị bất hoạt là gì?", "a": ["A. Liên tục tạo tín hiệu phân chia", "B. Tế bào mất khả năng duy trì các điểm kiểm soát (checkpoints), dẫn đến sự phân chia không kiểm soát", "C. Phá vỡ màng nhân", "D. Tạo kháng thể"], "c": 1, "e": "Gen ức chế như hệ thống phanh xe, khi phanh hỏng (bất hoạt), xe (tế bào) sẽ lao dốc phân chia không thể dừng lại."}, {"q": "Câu 116: Meta-analysis (2019) về \"Stress công việc và nguy cơ ung thư\", kết luận nào đúng?", "a": ["A. Stress không làm tăng nguy cơ", "B. Stress công việc làm tăng nguy cơ ung thư đại trực tràng, phổi và thực quản", "C. Stress chỉ gây ung thư nữ giới", "D. Stress gây đột biến BRCA"], "c": 1, "e": "Stress mạn tính gây suy giảm miễn dịch và thói quen sinh hoạt kém, từ đó gián tiếp thúc đẩy ung thư tiêu hóa, phổi."}, {"q": "Câu 117: Bệnh nhân từng xạ trị vùng chậu (Pelvic radiation), nguy cơ xuất hiện ung thư thứ phát nào ở hệ niệu?", "a": ["A. Vú", "B. Ung thư biểu mô tế bào chuyển tiếp (Transitional cell carcinoma) ở bàng quang/đường niệu", "C. Phổi", "D. Mesothelioma"], "c": 1, "e": "Tia xạ chiếu vào chậu hông đi xuyên qua bàng quang, làm tế bào niêm mạc chuyển tiếp ở đây bị đột biến tia xạ."}, {"q": "Câu 118: Cơ chế hình thành \"Thể apoptotic\" trong quá trình chết tế bào diễn ra thế nào?", "a": ["A. Phình to vỡ tung", "B. Nhân tế bào co đặc lại, màng tế bào hình thành các bóng nước và chia tách thành các phần nhỏ để đại thực bào dọn dẹp", "C. Tế bào dung hợp với nhau", "D. Đóng băng"], "c": 1, "e": "Apoptosis (chết chương trình) rất \"sạch sẽ\", tế bào phân rã thành túi kín không gây viêm mô xung quanh."}, {"q": "Câu 119: Yếu tố sinh ung thư từ thuốc lá (như Nitrosamine) tương tác với DNA như thế nào?", "a": ["A. Không qua màng tế bào", "B. Chỉ gắn vào Protein", "C. Tạo gốc alkyl hóa và liên kết cộng hóa trị với DNA làm thay đổi mã di truyền", "D. Là enzyme cắt DNA"], "c": 2, "e": "Các gốc hóa học phản ứng mạnh tấn công base DNA, tạo adduct bền vững ngăn cản sao chép chính xác."}, {"q": "Câu 120: Cơ chế chính tia UV gây đột biến da là gì?", "a": ["A. Xuyên sâu tủy xương", "B. Ion hóa phá vỡ toàn bộ NST", "C. Tạo ra các liên kết chéo pyrimidine (như cyclobutane pyrimidine dimers - CPDs)", "D. Đầu độc ty thể"], "c": 2, "e": "Năng lượng UV làm 2 base Thymine cạnh nhau dính chặt lại (Dimers), khiến enzyme tổng hợp DNA đọc sai mã."}, {"q": "Câu 121: Hơn 90% các trường hợp ung thư cổ tử cung xuất phát từ vùng giải phẫu nào?", "a": ["A. Biểu mô trụ", "B. Vùng chuyển tiếp (Transformation zone)", "C. Lỗ trong", "D. Thân tử cung"], "c": 1, "e": "Vùng chuyển tiếp là nơi giao thoa sinh lý biểu mô trụ và lát, tế bào phân chia liên tục nên cực kỳ dễ nhiễm HPV."}, {"q": "Câu 122: Tác nhân chính gây ra hơn 95% ca ung thư cổ tử cung là gì?", "a": ["A. Vi khuẩn Chlamydia", "B. Nấm Candida", "C. Virus HPV (Human Papillomavirus)", "D. Ký sinh trùng"], "c": 2, "e": "HPV được chứng minh là nguyên nhân cần thiết và đủ (đặc biệt các chủng nguy cơ cao)."}, {"q": "Câu 123: Hai chủng HPV nào chiếm 70% nguyên nhân gây ung thư CTC?", "a": ["A. 6 và 11", "B. 16 và 18", "C. 31 và 33", "D. 45 và 52"], "c": 1, "e": "HPV tuýp 16 và 18 mang độc lực ung thư cao nhất, là mục tiêu chính của tất cả các vaccine hiện nay."}, {"q": "Câu 124: Quá trình nhiễm HPV ở CTC thường có đặc điểm gì?", "a": ["A. 100% tiến triển thành ung thư", "B. Đa phần nhiễm thoáng qua và tự đào thải", "C. Luôn có triệu chứng", "D. Ăn mòn biểu mô ngay"], "c": 1, "e": "Hầu hết phụ nữ nhiễm HPV ở tuổi đôi mươi, nhưng hệ miễn dịch khỏe mạnh sẽ tự đào thải virus trong 1-2 năm."}, {"q": "Câu 125: Thời gian từ nhiễm HPV tiến triển thành ung thư CTC xâm lấn là bao lâu?", "a": ["A. 1 - 2 tháng", "B. 1 - 2 năm", "C. 5 - 10 năm", "D. 10 - 30 năm"], "c": 3, "e": "Quá trình tích hợp DNA và đột biến diễn ra rất chậm chạp (10-30 năm), tạo cơ hội \"vàng\" cho việc sàng lọc."}, {"q": "Câu 126: Triệu chứng lâm sàng giai đoạn muộn phổ biến nhất của ung thư CTC là gì?", "a": ["A. Rụng tóc", "B. Sốt", "C. Xuất huyết âm đạo bất thường (đặc biệt sau giao hợp)", "D. Đau dạ dày"], "c": 2, "e": "Khối u hoại tử bở, rất dễ chảy máu khi có va chạm vật lý vào vùng cổ tử cung."}, {"q": "Câu 127: Biểu mô CTC bao gồm 2 loại chính nào?", "a": ["A. Lát và trụ", "B. Vuông và chuyển tiếp", "C. Hô hấp và lát", "D. Tuyến bã và lát"], "c": 0, "e": "Cổ tử cung ngoài là biểu mô lát tầng không sừng hóa, kênh cổ tử cung trong là biểu mô trụ đơn tiết nhầy."}, {"q": "Câu 128: Tổn thương đại thể dạng nào thường gặp nhất trong ung thư CTC?", "a": ["A. Dạng thâm nhiễm cứng", "B. Dạng sùi (như bông cải to, bở, dễ chảy máu)", "C. Loét sâu", "D. Nang nước"], "c": 1, "e": "Khối u sùi lên mặt bề mặt âm đạo hình súp lơ, rất giàu mạch máu nên rất dễ chảy máu rỉ rả."}, {"q": "Câu 129: Phương pháp VIA sử dụng dung dịch nào quan sát CTC?", "a": ["A. Lugol", "B. Nước muối", "C. Acid acetic 3 - 5%", "D. Thuốc tím"], "c": 2, "e": "Acid acetic làm đông kết protein trong các tế bào tiền ung thư có nhân to, tạo hình ảnh vết trắng (Acetowhite)."}, {"q": "Câu 130: Ung thư CTC tỷ lệ mắc cao tập trung ở đâu?", "a": ["A. Bắc Âu", "B. Bắc Mỹ", "C. Các quốc gia thu nhập thấp và trung bình", "D. Quốc gia phát triển"], "c": 2, "e": "Các nước nghèo chiếm 90% ca mắc do thiếu vaccine và không có chương trình khám sàng lọc Pap/HPV rộng rãi."}, {"q": "Câu 131: Loại mô học nào chiếm tỷ lệ cao nhất (85%) trong ung thư CTC?", "a": ["A. Carcinoma tế bào gai (Squamous)", "B. Carcinoma tế bào tuyến", "C. Sarcoma", "D. Melanoma"], "c": 0, "e": "Do khối u xuất phát từ lớp biểu mô lát bao phủ cổ ngoài tử cung."}, {"q": "Câu 132: WHO khuyến cáo độ tuổi nào là mục tiêu chính tiêm vaccine HPV cho trẻ nữ?", "a": ["A. 1 - 5 tuổi", "B. 9 - 14 tuổi", "C. 20 - 25 tuổi", "D. Trên 30"], "c": 1, "e": "Tiêm vaccine trước khi quan hệ tình dục lần đầu mang lại lượng kháng thể bảo vệ tối đa và bền vững nhất."}, {"q": "Câu 133: Xét nghiệm tế bào học nhúng dịch tầm soát ung thư CTC gọi là gì?", "a": ["A. ThinPrep (Liquid-based)", "B. Sinh thiết", "C. VIA", "D. Nạo kênh"], "c": 0, "e": "ThinPrep rửa trôi chất nhầy và hồng cầu, giữ lại tế bào sắc nét trên lam kính, tăng độ nhạy phát hiện ung thư."}, {"q": "Câu 134: Chiến lược 90-70-90 của WHO, con số 70 đại diện cho mục tiêu nào?", "a": ["A. 70% trẻ em gái tiêm HPV", "B. 70% phụ nữ được sàng lọc bằng xét nghiệm hiệu quả cao ở tuổi 35 và 45", "C. 70% phụ nữ mắc ung thư được điều trị", "D. 70% nam giới tiêm vaccine"], "c": 1, "e": "WHO hướng đến bao phủ sàng lọc bằng HPV DNA test độ nhạy cao thay thế cho Pap test ở mốc tuổi quan trọng."}, {"q": "Câu 135: Đặc điểm dịch âm đạo ở ung thư CTC giai đoạn muộn?", "a": ["A. Trong suốt", "B. Trắng bã đậu", "C. Dịch loãng, đục, lẫn máu, mùi hôi thối", "D. Nhầy dính"], "c": 2, "e": "Do khối u hoại tử, máu phân hủy kết hợp với vi khuẩn yếm khí sinh ra chất dịch có mùi khắm đặc trưng."}, {"q": "Câu 136: Hướng dẫn WHO (2021), lựa chọn xét nghiệm sàng lọc đầu tay (Primary screening) là gì?", "a": ["A. VIA", "B. Pap smear", "C. Xét nghiệm HPV DNA", "D. Soi CTC"], "c": 2, "e": "Xét nghiệm tìm DNA của virus cho độ nhạy vượt trội, phát hiện nguy cơ từ rất sớm trước khi có bất thường tế bào."}, {"q": "Câu 137: Biểu mô lát (Squamous) của CTC bình thường có mấy lớp tế bào?", "a": ["A. 2", "B. 3", "C. 5 lớp (đáy, cận đáy, trung gian, bề mặt, bong vảy)", "D. 7"], "c": 2, "e": "Đây là biểu mô lát tầng không sừng hóa, phân tầng rõ rệt từ dưới lên trên để bảo vệ niêm mạc."}, {"q": "Câu 138: Tỷ số chênh (OR) của nhiễm HPV 16 đối với nguy cơ ung thư CTC là bao nhiêu?", "a": ["A. 1.3", "B. 8.2", "C. 50", "D. 435"], "c": 3, "e": "OR=435 là một con số khổng lồ, chứng minh mối quan hệ nhân-quả hiển nhiên của HPV 16 với ung thư CTC."}, {"q": "Câu 139: Phương pháp VIA có ưu - nhược điểm gì nổi bật?", "a": ["A. Khách quan; đắt", "B. Rẻ, có thể điều trị ngay; Phụ thuộc nhiều vào kỹ năng, chủ quan người đọc", "C. Độ nhạy 100%", "D. Không cần y tế"], "c": 1, "e": "Nhìn bằng mắt thường nên bác sĩ kinh nghiệm kém sẽ dễ chẩn đoán sai, nhưng tiện vì khám xong có thể đốt u ngay."}, {"q": "Câu 140: Cập nhật vaccine HPV của WHO (12/2022) so với trước đây là gì?", "a": ["A. Tăng lên 4 liều", "B. Khuyến cáo lịch tiêm 1 hoặc 2 liều cho trẻ gái 9-14 tuổi", "C. Chỉ tiêm phụ nữ có gia đình", "D. Kết hợp Viêm gan B"], "c": 1, "e": "Các nghiên cứu chứng minh chỉ 1 liều duy nhất vẫn sinh miễn dịch tương đương 2, 3 liều, giúp tiết kiệm vắc-xin khổng lồ."}, {"q": "Câu 141: Yếu tố nào KHÔNG làm giảm khả năng tự đào thải virus HPV?", "a": ["A. Đồng nhiễm HIV", "B. Dùng thuốc ức chế miễn dịch", "C. Hút thuốc", "D. Quan hệ an toàn dùng bao cao su"], "c": 3, "e": "HIV, thuốc lá làm suy yếu đại thực bào, khiến cơ thể không \"đuổi\" được HPV ra khỏi tế bào CTC."}, {"q": "Câu 142: Theo FIGO 2018, giai đoạn IB của ung thư CTC là gì?", "a": ["A. Chỉ thấy trên vi thể", "B. Xâm lấn chu cung", "C. Tổn thương xâm lấn giới hạn ở CTC với chiều sâu đo được >5mm", "D. Di căn hạch"], "c": 2, "e": "IA là vi thể $<5mm$, IB là u có kích thước đo được rõ ràng trên lâm sàng nhưng vẫn khu trú ở tử cung."}, {"q": "Câu 143: Phác đồ ưu tiên Line 1 điều trị CTC di căn có PD-L1 (+) là gì?", "a": ["A. Tamoxifen", "B. Pembrolizumab kết hợp Cisplatin/Paclitaxel (+/- Bevacizumab)", "C. Methotrexate", "D. Xạ áp sát"], "c": 1, "e": "Bổ sung liệu pháp miễn dịch (Pembrolizumab) vào hóa trị kinh điển đã kéo dài đáng kể OS cho bệnh nhân."}, {"q": "Câu 144: Chẩn đoán hình ảnh ưu thế nhất đánh giá xâm lấn chu cung, âm đạo là?", "a": ["A. Siêu âm", "B. CT Scan", "C. Chụp cộng hưởng từ vùng chậu (MRI)", "D. X-quang"], "c": 2, "e": "MRI cho độ tương phản mô mềm tuyệt vời, giúp nhìn rõ ranh giới khối u với lớp mỡ chu cung xung quanh."}, {"q": "Câu 145: Phẫu thuật cắt tử cung tận gốc Type C1 khác Type A ở đặc điểm nào?", "a": ["A. Cắt một phần tử cung", "B. Cắt rộng phần chu cung (parametrium) và dây chằng tử cung - âm đạo", "C. Không cắt CTC", "D. Cắt bàng quang"], "c": 1, "e": "Type A mổ cắt tử cung đơn giản ngoài cân, Type C vét rộng tổ chức liên kết quanh tử cung sát tận vách chậu."}, {"q": "Câu 146: Theo Globocan 2022, ung thư CTC đứng thứ mấy ở Nữ giới Việt Nam?", "a": ["A. 1", "B. 2", "C. 4 (sau Vú, Phổi, Đại trực tràng)", "D. 10"], "c": 2, "e": "Nhờ các chương trình giáo dục sinh sản, tỉ lệ ung thư CTC ở VN đã giảm mạnh và thoát khỏi Top 3."}, {"q": "Câu 147: Xạ trị và Hóa trị đồng thời (Cisplatin) giúp giảm nguy cơ tử vong khoảng bao nhiêu so với xạ đơn thuần?", "a": ["A. 5%", "B. 10%", "C. Xấp xỉ 40 - 50% (RR 0.5 - 0.6)", "D. Không khác biệt"], "c": 2, "e": "Cisplatin vừa tiêu diệt u vừa đóng vai trò như một chất \"kích xạ\" (Radiosensitizer) làm tăng sức phá hủy của tia xạ."}, {"q": "Câu 148: Tế bào tiền ung thư CTC thay đổi bất thường bắt đầu từ lớp nào?", "a": ["A. Lớp bề mặt", "B. Lớp tế bào đáy (Basal)", "C. Màng đáy", "D. Tế bào tuyến"], "c": 1, "e": "Virus HPV xâm nhập qua vết xước, chui vào lớp tế bào non ở đáy và bắt đầu phân chia chiếm dần lên bề mặt."}, {"q": "Câu 149: Phẫu thuật C2N (Nerve-sparing Type C2) nhằm mục đích gì?", "a": ["A. Cắt bỏ tối đa thần kinh", "B. Cắt bỏ chu cung nhưng bảo tồn thần kinh hạ vị giúp giữ chức năng bàng quang, trực tràng", "C. Cắt hạch chủ", "D. Bảo tồn tử cung"], "c": 1, "e": "Bảo tồn thần kinh tự chủ giúp bệnh nhân không bị rối loạn tiểu tiện/đại tiện dai dẳng sau mổ."}, {"q": "Câu 150: CIN III tương ứng với tình trạng nào trên mô bệnh học?", "a": ["A. Viêm lộ tuyến", "B. Loạn sản nặng / Ung thư biểu mô tại chỗ", "C. Di căn xa", "D. Polyp"], "c": 1, "e": "Tế bào bất thường chiếm toàn bộ độ dày biểu mô (từ đáy lên đỉnh) nhưng chưa chọc thủng màng đáy."}, {"q": "Câu 151: HPV gây ung thư thông qua cơ chế phân tử nào sau khi xâm nhập tế bào biểu mô màng đáy?", "a": ["A. Sản xuất ngoại độc tố ly giải", "B. Phản ứng miễn dịch hoại tử", "C. DNA virus tích hợp vào tế bào chủ, sản sinh oncoprotein (E6, E7) gây rối loạn chu kỳ tế bào", "D. Thay nhân tế bào"], "c": 2, "e": "Oncoprotein E6 bẻ gãy gen p53, E7 bẻ gãy gen pRB, vô hiệu hóa hoàn toàn hệ thống phanh kìm hãm tế bào."}, {"q": "Câu 152: Bệnh nhân u 3cm, thâm nhiễm 1/3 trên âm đạo, chưa xâm lấn chu cung. Giai đoạn theo FIGO 2018?", "a": ["A. IB2", "B. IIA1", "C. IIB", "D. IIIA"], "c": 1, "e": "Giai đoạn IIA là ăn lan xuống âm đạo nhưng chưa tới phần ba dưới và chưa lan ra chu cung; u $<4cm$ là IIA1."}, {"q": "Câu 153: Sự hiện diện của di căn hạch chậu tự động xếp bệnh nhân vào giai đoạn nào?", "a": ["A. IIB", "B. IIIC1", "C. IVA", "D. IVB"], "c": 1, "e": "Bất kể khối u tại chỗ bé hay lớn, chỉ cần có di căn hạch vùng chậu thì bệnh tự động được phân độ Stage IIIC1."}, {"q": "Câu 154: Thử nghiệm KEN SHE trên phụ nữ trẻ về tiêm 1 liều vaccine HPV cho kết quả nổi bật nào?", "a": ["A. Không tác dụng", "B. Hiệu quả bảo vệ khỏi nhiễm HPV dai dẳng 97.5%, tương đương nhiều liều", "C. Chỉ tác dụng khi đã nhiễm", "D. Bảo vệ 6 tháng"], "c": 1, "e": "Đây là bằng chứng thép của WHO để thay đổi chính sách tiêm 1 liều cho toàn thế giới."}, {"q": "Câu 155: Ở bệnh nhân đồng nhiễm HIV, theo WHO, thuật toán sàng lọc là gì?", "a": ["A. Screen-and-treat", "B. Sàng lọc mỗi 10 năm", "C. Sàng lọc - Phân tầng - Điều trị (Screen, triage and treat)", "D. Bỏ qua sàng lọc"], "c": 2, "e": "Nhóm HIV có tỷ lệ dương tính giả cao, cần làm thêm 1 test phân tầng (Triage) để chắc chắn trước khi điều trị."}, {"q": "Câu 156: QĐ 358/QĐ-BYT đặt mục tiêu xóa bỏ ung thư CTC với tỷ lệ mắc mới dưới ngưỡng nào?", "a": ["A. 10 / 100,000", "B. 4 / 100,000 phụ nữ", "C. 1 / 100,000", "D. 0 ca"], "c": 1, "e": "\"Xóa bỏ\" (Elimination) trong y tế công cộng không phải là zero, mà là ép tỷ lệ mắc xuống dưới ngưỡng $4/10^5$ dân."}, {"q": "Câu 157: Sự bất bình đẳng về tử vong do ung thư CTC toàn cầu do yếu tố nào?", "a": ["A. Gen kháng HPV bẩm sinh", "B. Thiếu chương trình sàng lọc và tiêm vaccine ở các quốc gia nghèo", "C. Độc lực HPV nước nghèo cao", "D. Nước giàu không nhiễm HPV"], "c": 1, "e": "Ung thư CTC là bệnh của sự nghèo đói và hệ thống y tế dự phòng yếu kém, không phải do đột biến gen di truyền."}, {"q": "Câu 158: Đánh giá bệnh nhân giai đoạn IB3 (u >4cm, khu trú), lựa chọn triệt căn nào?", "a": ["A. Hóa-xạ trị đồng thời HOẶC Phẫu thuật cắt tử cung tận gốc + nạo hạch", "B. Cắt LEEP", "C. Miễn dịch đơn thuần", "D. Cắt bán phần"], "c": 0, "e": "Khối u bự (IB3) có nguy cơ di căn hạch cao, xạ trị thường được ưu tiên để tránh phẫu thuật rộng biến chứng cao."}, {"q": "Câu 159: Nhận định nào chính xác về độ nhạy và đặc hiệu giữa Pap và HPV DNA?", "a": ["A. Pap nhạy hơn", "B. HPV DNA có độ nhạy cao hơn Pap smear (thường >90%) nhưng độ đặc hiệu có thể thấp hơn đôi chút", "C. VIA nhạy 100%", "D. Y hệt nhau"], "c": 1, "e": "Rất nhiều người nhiễm HPV nhưng tế bào chưa hư, do đó test HPV (+) (Nhạy cao) nhưng chưa chắc bị bệnh (Đặc hiệu thấp)."}, {"q": "Câu 160: Cơ sở áp dụng chiến lược tiêm chủng \"Catch-up\" kéo dài (<=25 tuổi) là gì?", "a": ["A. Dưới 15 tuổi không sinh kháng thể", "B. Tạo miễn dịch cộng đồng nhanh và bảo vệ những người đã qua tuổi phơi nhiễm", "C. Thay thế sàng lọc", "D. Chỉ tác dụng trên 20"], "c": 1, "e": "Tiêm vét diện rộng giúp tạo lưới bảo vệ bao phủ toàn dân (Herd immunity) chặn đứng đường lây truyền virus trong giới trẻ."}, {"q": "Câu 161: Trên toàn cầu ở nữ giới, ung thư vú đứng thứ mấy về số ca mắc mới?", "a": ["A. 1", "B. 2", "C. 3", "D. 5"], "c": 0, "e": "Ung thư vú là ung thư phổ biến nhất ở phụ nữ trên toàn thế giới, vượt trội so với các loại khác."}, {"q": "Câu 162: Yếu tố sinh sản nào làm tăng khả năng mắc ung thư vú?", "a": ["A. Sinh con trước 20 tuổi", "B. Nhiều con", "C. Không sinh con hoặc sinh con muộn (>35 tuổi)", "D. Cho bú kéo dài"], "c": 2, "e": "Quá trình mang thai và cho con bú giúp tuyến vú ngừng chu kỳ rụng trứng, làm giảm sự phơi nhiễm liên tục với Estrogen."}, {"q": "Câu 163: Vị trí nào tuyến vú là nơi thường xuất hiện u ác tính nhất (chiếm 44%)?", "a": ["A. 1/4 trên trong", "B. 1/4 dưới trong", "C. 1/4 dưới ngoài", "D. 1/4 trên ngoài"], "c": 3, "e": "Góc 1/4 trên ngoài (gần nách) tập trung mật độ tuyến vú dày đặc nhất nên xác suất sinh u cao nhất."}, {"q": "Câu 164: Dấu hiệu \"sần da cam\" (Peau d'orange) do hiện tượng gì?", "a": ["A. Phì đại nang lông", "B. Khối u tắc nghẽn bạch huyết dưới da gây phù nề", "C. Tích tụ canxi", "D. Viêm da"], "c": 1, "e": "Da bị phù ứ dịch bạch huyết căng mọng, nhưng các gốc nang lông bị níu chặt tạo thành các vết lõm giống hệt vỏ cam."}, {"q": "Câu 165: Tại Việt Nam (Globocan 2022), ung thư nào số ca mắc mới cao nhất tính chung hai giới?", "a": ["A. Gan", "B. Phổi", "C. Vú", "D. Đại trực tràng"], "c": 2, "e": "Vú hiện vượt qua Gan để trở thành loại ung thư có số ca chẩn đoán mắc mới lớn nhất nước."}, {"q": "Câu 166: Phương tiện nào là tiêu chuẩn vàng giảm tỷ lệ tử vong trong tầm soát ung thư vú?", "a": ["A. Siêu âm vú", "B. MRI", "C. Chụp X-quang tuyến vú (Nhũ ảnh / Mammography)", "D. PET/CT"], "c": 2, "e": "Nhũ ảnh là phương pháp duy nhất có các bằng chứng lâm sàng RCT quy mô lớn chứng minh làm giảm tỷ lệ tử vong rõ rệt."}, {"q": "Câu 167: Nhóm hạch nào là trạm di căn vùng quan trọng nhất trong ung thư vú?", "a": ["A. Hạch bẹn", "B. Hạch nách", "C. Hạch cổ", "D. Hạch chủ"], "c": 1, "e": "Khoảng 75% dịch bạch huyết của tuyến vú được dẫn lưu trực tiếp đổ về chuỗi hạch bạch huyết vùng nách."}, {"q": "Câu 168: Yếu tố di truyền nào làm tăng nguy cơ mắc ung thư vú mạnh mẽ nhất?", "a": ["A. Đột biến p53", "B. Đột biến EGFR", "C. Đột biến gen BRCA1 và BRCA2", "D. Đột biến KRAS"], "c": 2, "e": "Mang gen BRCA đột biến đẩy nguy cơ mắc ung thư vú lên đến 70-80% trong suốt cuộc đời."}, {"q": "Câu 169: Phụ nữ được khuyến cáo tự khám vú vào thời điểm nào trong chu kỳ kinh nguyệt?", "a": ["A. Khi đang hành kinh", "B. Khoảng 7 - 10 ngày sau khi sạch kinh", "C. Trước khi hành kinh 1 ngày", "D. Bất kỳ ngày nào"], "c": 1, "e": "Lúc này nồng độ hormone sinh dục hạ thấp nhất, mô vú mềm mại nhất, không bị cương đau giúp sờ bướu dễ nhất."}, {"q": "Câu 170: Sinh thiết hạch gác trong ung thư vú có ý nghĩa gì?", "a": ["A. Lấy toàn bộ vú", "B. Xác định hạch đầu tiên nhận dẫn lưu để quyết định có cần vét hạch nách hay không", "C. Tiêu diệt u", "D. Thay thế hóa trị"], "c": 1, "e": "Hạch gác (Sentinel Node) giống như trạm thu phí đầu tiên; nếu hạch này sạch thì toàn bộ chuỗi hạch phía sau đều sạch."}, {"q": "Câu 171: Siêu âm vú có ưu điểm lớn nhất trong trường hợp nào?", "a": ["A. Thay thế hoàn toàn nhũ ảnh", "B. Đánh giá nang dịch/u đặc và hữu ích ở phụ nữ có mô vú đặc/dày", "C. Phát hiện vi vôi hóa", "D. Chụp toàn thân"], "c": 1, "e": "Mô vú của phụ nữ trẻ/châu Á thường rất đặc (trắng trên X-quang), siêu âm dùng sóng âm sẽ phân biệt cấu trúc u tốt hơn."}, {"q": "Câu 172: Dấu hiệu nào ở núm vú gợi ý bệnh ác tính?", "a": ["A. Cương cứng khi lạnh", "B. Tụt núm vú mới xuất hiện, rỉ dịch có máu hoặc loét", "C. Hai núm kích thước không bằng", "D. Đổi màu khi mang thai"], "c": 1, "e": "Khối u ác tính thường co kéo các dây chằng Cooper làm núm vú tụt sâu vào trong và chảy dịch máu bất thường."}, {"q": "Câu 173: Yếu tố nào KHÔNG phải là nguy cơ gây ung thư vú?", "a": ["A. Hành kinh sớm (trước 12 tuổi)", "B. Mãn kinh muộn (sau 55 tuổi)", "C. Luyện tập thể thao và chế độ ăn rau xanh", "D. Béo phì và rượu"], "c": 2, "e": "Lối sống năng động và ăn uống khoa học là yếu tố bảo vệ mạnh mẽ, giúp giảm thiểu nguy cơ ung thư vú."}, {"q": "Câu 174: ER và PR trong hóa mô miễn dịch ung thư vú viết tắt của?", "a": ["A. Thụ thể tăng trưởng biểu bì", "B. Thụ thể Estrogen và Progesterone", "C. Thụ thể Insulin", "D. Thụ thể Androgen"], "c": 1, "e": "Đây là hai thụ thể nội tiết sinh dục nữ; nếu u có mặt 2 thụ thể này, nó sẽ bị kích thích lớn lên bởi hormone."}, {"q": "Câu 175: Chụp nhũ ảnh tầm soát thông thường bao gồm mấy tư thế cho mỗi vú?", "a": ["A. 1", "B. 2 (trên-dưới CC và chếch bên MLO)", "C. 4", "D. 6"], "c": 1, "e": "Tư thế ép Craniocaudal (CC) và Mediolateral Oblique (MLO) giúp dàn mỏng mô vú, không bỏ sót nốt mờ ở hố nách."}, {"q": "Câu 176: Phân nhóm phân tử \"Luminal A\" có đặc tính hóa mô miễn dịch nào?", "a": ["A. ER/PR dương tính, HER2 âm tính, Ki67 thấp", "B. ER/PR âm, HER2 dương", "C. ER dương, HER2 dương, Ki67 cao", "D. Tam âm"], "c": 0, "e": "Luminal A là thể có nội tiết (+), phát triển cực kỳ chậm (Ki67 thấp), tiên lượng tốt nhất và đáp ứng thuốc nội tiết tuyệt vời."}, {"q": "Câu 177: Loại mô học nào chiếm tỷ lệ cao nhất trong ung thư biểu mô tuyến vú?", "a": ["A. Ung thư biểu mô tiểu thùy xâm nhập", "B. Ung thư biểu mô ống xâm nhập (Ductal carcinoma NST)", "C. Dạng tủy", "D. Nhú"], "c": 1, "e": "Đa số các tổn thương ác tính khởi phát từ các tế bào lót mặt trong của ống dẫn sữa (Ductal)."}, {"q": "Câu 178: Phụ nữ nào ĐƯỢC KHUYẾN CÁO MRI tuyến vú tầm soát định kỳ?", "a": ["A. Nguy cơ trung bình trên 40 tuổi", "B. Nguy cơ mắc bệnh suốt đời > 20%, mang đột biến BRCA hoặc từng xạ trị ngực", "C. Đang cho bú", "D. Mãn kinh"], "c": 1, "e": "MRI vú siêu nhạy nhưng đắt tiền và dễ dương tính giả, chỉ khuyên dùng tầm soát riêng cho nhóm cực kỳ nguy cơ cao."}, {"q": "Câu 179: Phân độ SBR trong ung thư vú dựa trên tiêu chí nào?", "a": ["A. Kích thước u, hạch", "B. Sự hình thành ống tuyến, mức độ đa hình nhân, và chỉ số phân bào", "C. Tỷ lệ thụ thể Estrogen", "D. Xâm lấn da cơ"], "c": 1, "e": "Bác sĩ giải phẫu bệnh sẽ chấm điểm dựa trên mức độ biệt hóa của tế bào qua kính hiển vi để tính ra độ ác tính SBR (1,2,3)."}, {"q": "Câu 180: Yếu tố \"xương sống\" bắt buộc để giảm tái phát cho ung thư vú có thụ thể nội tiết dương tính (HR+)?", "a": ["A. Miễn dịch", "B. Hóa trị liều cao", "C. Liệu pháp nội tiết (Endocrine therapy)", "D. Xạ toàn thân"], "c": 2, "e": "Thuốc nội tiết (như Tamoxifen/AI) uống hàng ngày trong 5-10 năm giúp \"bỏ đói\" tế bào bướu vi thể để tránh tái phát."}, {"q": "Câu 181: Thuốc nhóm Ức chế Aromatase (AI) ưu tiên chỉ định cho ai?", "a": ["A. Phụ nữ chưa mãn kinh", "B. Phụ nữ đã mãn kinh có ER dương tính", "C. Mang thai", "D. Tam âm"], "c": 1, "e": "Phụ nữ mãn kinh hết estrogen buồng trứng, estrogen được tạo từ mô mỡ nhờ men Aromatase, AI sẽ khóa men này lại."}, {"q": "Câu 182: Khuyến cáo tuổi BẮT ĐẦU mạnh mẽ tầm soát nhũ ảnh theo ACS là?", "a": ["A. 30 tuổi", "B. Bắt đầu ở tuổi 45 (cho phép từ 40)", "C. Có triệu chứng", "D. 60 tuổi"], "c": 1, "e": "Hiệp hội Ung thư Hoa Kỳ (ACS) khuyên cáo quyết liệt nên bắt đầu tầm soát đều đặn hàng năm kể từ mốc 45 tuổi."}, {"q": "Câu 183: Lợi ích chính của chụp nhũ ảnh (Meta-analysis) là gì?", "a": ["A. Giảm chi phí mổ", "B. Tránh rụng tóc", "C. Giảm nguy cơ tử vong do ung thư vú (khoảng 20%)", "D. Ngăn ngừa khối u phát sinh"], "c": 2, "e": "Nhũ ảnh phát hiện u từ vi thể, giúp điều trị triệt căn 100% trước khi nó di căn lan tràn vào hệ thống."}, {"q": "Câu 184: Cắt tuyến vú dự phòng hai bên thảo luận ở nhóm nào?", "a": ["A. U xơ lành", "B. Phụ nữ khỏe mạnh mang đột biến gen BRCA1/2", "C. Giai đoạn cuối", "D. Nang nước"], "c": 1, "e": "Nổi tiếng nhất là diễn viên Angelina Jolie, việc cắt bỏ tuyến vú sạch sẽ chặn đứng 90-95% rủi ro mắc bệnh."}, {"q": "Câu 185: Phương pháp xạ trị trong mổ (IORT) có đặc điểm gì?", "a": ["A. Xạ 5 tuần", "B. Tập trung liều bức xạ cao tại nền khối u ngay lúc mổ bảo tồn", "C. Uống phóng xạ", "D. Cho nam giới"], "c": 1, "e": "Ngay sau khi bác sĩ phẫu thuật khoét khối u, đầu phát tia sẽ được đưa trực tiếp vào ổ mổ chiếu xạ diệt mầm mống ngay tắp lự."}, {"q": "Câu 186: Nhóm thuốc nhắm đích Trastuzumab sử dụng đặc hiệu cho loại nào?", "a": ["A. Ung thư vú có thụ thể HER2 khuếch đại (HER2-positive)", "B. Tam âm", "C. Tại chỗ", "D. BRCA lặn"], "c": 0, "e": "Trastuzumab (Herceptin) là kháng thể đặc hiệu nhận diện và khóa chết thụ thể HER2 trên bề mặt tế bào ung thư vú."}, {"q": "Câu 187: Pillar 2 (Chẩn đoán kịp thời) của WHO đặt mục tiêu thời gian từ lúc khám đến khi có kết quả sinh thiết là?", "a": ["A. 7 ngày", "B. Trong vòng 60 ngày", "C. 6 tháng", "D. Không quy định"], "c": 1, "e": "Thời gian 60 ngày là tiêu chuẩn vàng tối đa để hệ thống y tế giải quyết mọi xét nghiệm và bắt đầu điều trị không làm trễ nải."}, {"q": "Câu 188: Nhược điểm tiềm tàng của tầm soát nhũ ảnh định kỳ là?", "a": ["A. Gây vô sinh", "B. Dương tính giả dẫn đến lo âu và sinh thiết không cần thiết (Overdiagnosis)", "C. Chắc chắn gây ung thư giáp", "D. Tăng ung thư phổi"], "c": 1, "e": "Nhiều nốt vôi hóa lành tính cũng hiện lên trên phim, khiến bệnh nhân hoang mang đi làm sinh thiết oan uổng."}, {"q": "Câu 189: Đặc điểm hạch di căn tuyến vú giai đoạn muộn?", "a": ["A. Rất mềm, di động, đau", "B. Hạch chắc, cứng, ít di động do vỡ vỏ bao dính vào mô xung quanh", "C. To xẹp theo kỳ kinh", "D. Biến mất khi dùng kháng sinh"], "c": 1, "e": "Tế bào ung thư lấp đầy hạch bạch huyết làm hạch rắn như đá và đóng kén cố định vùng nách."}, {"q": "Câu 190: Khối u vú T1c N0 M0 (kích thước <2cm, chưa di căn hạch) thuộc giai đoạn nào?", "a": ["A. 0", "B. I", "C. III", "D. IV"], "c": 1, "e": "U nhỏ, chưa có di căn hạch vùng, cũng chưa đi xa được xếp gọn gàng vào Giai đoạn sơ khởi (Stage I)."}, {"q": "Câu 191: Phụ nữ 45 tuổi DCIS (ung thư tại chỗ) có ER(+). Đã phẫu thuật bảo tồn + xạ trị. Bước điều trị NCCN cần thiết nhất tiếp theo?", "a": ["A. Hóa trị", "B. Liệu pháp nội tiết (như Tamoxifen) trong 5 năm", "C. Cắt đối bên", "D. Trastuzumab"], "c": 1, "e": "DCIS (GĐ 0) không đe dọa sinh mạng, tuyệt đối không dùng hóa trị độc tính. Tamoxifen là bắt buộc để ngừa u tái sinh cục bộ."}, {"q": "Câu 192: Nghiên cứu Cost-Effectiveness tại VN (2013), sàng lọc Khám vú lâm sàng (CBE) có ICER bao nhiêu?", "a": ["A. Khoảng 994 USD/LYS (Rất hiệu quả chi phí)", "B. 50,000 USD, không hiệu quả", "C. LYS = 0", "D. Đắt hơn nhũ ảnh 3 lần"], "c": 0, "e": "Do thu nhập trung bình của VN thấp, việc dùng y bác sĩ khám vú (CBE) định kỳ mang lại số năm sống thêm với chi phí vô cùng rẻ."}, {"q": "Câu 193: Giải phẫu hạch nách phân 3 level dựa trên mốc nào?", "a": ["A. Cơ ngực lớn", "B. Cơ ngực bé (Pectoralis minor)", "C. TM nách", "D. ĐM dưới đòn"], "c": 1, "e": "Level 1 (ngoài), Level 2 (phía sau), Level 3 (phía trong cơ ngực bé). Mốc này quyết định bác sĩ vét sâu đến đâu."}, {"q": "Câu 194: Nam giới mang đột biến BRCA2, nguy cơ tích lũy mắc ung thư vú đến tuổi 70 là?", "a": ["A. 0%", "B. 0.2 - 1.2%", "C. 1.8 - 7.1%", "D. 50%"], "c": 2, "e": "Mặc dù nam giới hiếm bị UT vú, nhưng nếu có gen lặn BRCA2, nguy cơ tăng vọt lên khoảng 7%, cao gấp trăm lần dân thường."}, {"q": "Câu 195: Nữ 50 tuổi, u pT2 pN2 (4 hạch dương tính), đã mổ đoạn nhũ (Mastectomy). NCCN chỉ định gì?", "a": ["A. Không xạ trị", "B. Xạ trị thành ngực và hạch vùng (Comprehensive RNI) - Cat 1", "C. Xạ hạch thượng đòn", "D. Xạ áp sát"], "c": 1, "e": "Dù đã cắt phăng cả vú, nhưng với 4 hạch nách dương tính, nguy cơ tế bào rơi rớt bám ở vách ngực rất cao, bắt buộc phải chiếu xạ ngoài."}, {"q": "Câu 196: Phân nhóm \"Tam âm\" (Triple Negative) có đặc điểm tiên lượng gì?", "a": ["A. Tốt, đáp ứng Tamoxifen", "B. Độ ác tính cực cao, di căn não/phổi nhanh, không đáp ứng nội tiết và HER2, chủ yếu dựa Hóa trị/Miễn dịch", "C. Ki67 thấp", "D. 100% khỏi"], "c": 1, "e": "Âm tính với cả 3 thụ thể ER, PR, HER2 nên các vũ khí nhắm đích và nội tiết bị vô hiệu, buộc phải đánh bằng hóa chất độc tính cao."}, {"q": "Câu 197: Giải pháp tài chính bền vững (QĐ 358/QĐ-BYT) để thúc đẩy sàng lọc ung thư vú và CTC là?", "a": ["A. Cắt giảm lương mua máy", "B. Lồng ghép chi phí sàng lọc vào Quỹ Bảo hiểm Y tế (BHYT)", "C. Viện trợ 100%", "D. Tự chi trả"], "c": 1, "e": "Cơ chế chi trả từ bảo hiểm sẽ loại bỏ rào cản chi phí cá nhân, khuyến khích phụ nữ nghèo đi tầm soát sớm."}, {"q": "Câu 198: Chênh lệch tỷ lệ sống còn 5 năm ung thư vú giữa Mỹ và Nam Phi ở mức nào?", "a": ["A. Nam Phi 10/10, Mỹ 5/10", "B. Mỹ khoảng 9/10 sống sót, Nam Phi chỉ khoảng 4/10", "C. Ngang nhau", "D. Lệch 1%"], "c": 1, "e": "Thể hiện sự bất công trong phân phối năng lực y tế toàn cầu; phụ nữ da đen Nam Phi tử vong rất cao vì phát hiện khi u đã hoại tử."}, {"q": "Câu 199: Đánh giá Harms tầm soát nhũ ảnh cho 1000 phụ nữ trong 10 năm, tỷ lệ dương tính giả?", "a": ["A. Dưới 10", "B. Khoảng 720 ca bị dương tính giả phải làm thêm các xét nghiệm", "C. 100% nhầm", "D. Không có"], "c": 1, "e": "Cứ 1000 người chụp liên tục trong 10 năm, có hơn một nửa sẽ bị gọi lại để sinh thiết ít nhất một lần do các nốt lành tính gây nhiễu."}, {"q": "Câu 200: Cơ sở dùng thuốc AI ở phụ nữ MÃN KINH là?", "a": ["A. Buồng trứng tiết nhiều estrogen", "B. Phụ nữ mãn kinh không còn buồng trứng, estrogen chủ yếu từ mô mỡ cơ qua men Aromatase; thuốc AI ức chế men này làm cạn kiệt estrogen", "C. Thuốc diệt trực tiếp u", "D. Thay thế hormone"], "c": 1, "e": "Phụ nữ mãn kinh có nguồn estrogen chính từ ngoại biên, thuốc Aromatase Inhibitors sẽ khóa đứng quá trình biến mỡ thành hormone sinh dục."}, {"q": "Câu 1: Theo nghiên cứu trên tạp chí The Lancet, yếu tố nào đóng vai trò quyết định chính giúp con người sống lâu hơn?", "a": ["A. Yếu tố di truyền (Gen)", "B. Lối sống lành mạnh", "C. Môi trường sống hoàn toàn vô trùng", "D. Sử dụng nhiều thực phẩm chức năng"], "c": 1, "e": "Nghiên cứu trên The Lancet 2023 chỉ ra rằng lối sống lành mạnh quyết định tuổi thọ nhiều hơn là yếu tố di truyền."}, {"q": "Câu 2: Dự phòng ung thư cấp I (Primary Prevention) tác động vào giai đoạn nào của bệnh?", "a": ["A. Khi bệnh đã có triệu chứng lâm sàng rõ ràng", "B. Khi bệnh đang ở giai đoạn tiền lâm sàng (chưa có triệu chứng)", "C. Khi chưa có bệnh (No Disease)", "D. Khi bệnh đã di căn"], "c": 2, "e": "Dự phòng cấp I được thực hiện khi người bệnh hoàn toàn khỏe mạnh nhằm ngăn ngừa sự phát sinh bệnh."}, {"q": "Câu 3: Việc tiêm vaccine HPV phòng ngừa ung thư cổ tử cung thuộc cấp độ dự phòng nào?", "a": ["A. Dự phòng cấp I", "B. Dự phòng cấp II", "C. Dự phòng cấp III", "D. Dự phòng cấp IV"], "c": 0, "e": "Tiêm vaccine là biện pháp dự phòng cấp I giúp cơ thể tạo miễn dịch trước khi tiếp xúc với tác nhân gây bệnh."}, {"q": "Câu 4: Mục tiêu chính của dự phòng cấp II (Sàng lọc ung thư) là gì?", "a": ["A. Chữa khỏi ung thư giai đoạn cuối", "B. Phát hiện những bất thường trước khi có biểu hiện rõ ràng trên lâm sàng", "C. Loại bỏ hoàn toàn các yếu tố nguy cơ từ môi trường", "D. Giảm đau đớn cho bệnh nhân ung thư"], "c": 1, "e": "Sàng lọc (cấp II) nhằm tìm ra các tổn thương tiền ung thư hoặc ung thư giai đoạn sớm khi chưa có triệu chứng."}, {"q": "Câu 5: Theo Global Burden of Disease Study (2019), yếu tố nguy cơ hàng đầu gây tử vong do ung thư ở người trưởng thành là gì?", "a": ["A. Sử dụng rượu bia", "B. Béo phì", "C. Hút thuốc lá", "D. Lười vận động"], "c": 2, "e": "Khói thuốc lá chứa hàng trăm chất sinh ung thư và được thống kê là nguyên nhân hàng đầu gây tử vong do ung thư."}, {"q": "Câu 6: Để bảo vệ khỏi tác hại của ánh nắng mặt trời (tia UV), nên hạn chế ra ngoài vào khung giờ nào?", "a": ["A. 6:00 - 8:00", "B. 8:00 - 10:00", "C. 10:00 - 16:00", "D. 16:00 - 18:00"], "c": 2, "e": "Khung giờ 10:00 - 16:00 là thời điểm bức xạ tia cực tím (UV) từ mặt trời hoạt động mạnh nhất."}, {"q": "Câu 7: Độ nhạy (Sensitivity) của một xét nghiệm sàng lọc mang ý nghĩa gì?", "a": ["A. Khả năng xét nghiệm âm tính nếu người đó thực sự không có bệnh", "B. Khả năng xét nghiệm dương tính nếu người đó thực sự có bệnh", "C. Khả năng xét nghiệm tìm ra chính xác vị trí khối u", "D. Chi phí cần thiết để thực hiện xét nghiệm"], "c": 1, "e": "Độ nhạy đo lường tỷ lệ phát hiện đúng những người thực sự mắc bệnh (tránh âm tính giả)."}, {"q": "Câu 8: Theo khuyến cáo của Tổ chức Y tế Thế giới (WHO), việc tiêm vac
